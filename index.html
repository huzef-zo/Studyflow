<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="description" content="StudyFlow - Personal study organizer and focus manager">
  <meta name="theme-color" content="#121314">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StudyFlow">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-touch-fullscreen" content="yes">
  <meta name="web-app-capable" content="yes">
  
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="shortcut icon" type="image/png" href="./icon-192.png">
  
  <link rel="manifest" href="./manifest.json">
  <link rel="msapplication-config" href="browserconfig.xml">
  <meta name="msapplication-TileColor" content="#3B6FD8">
  
  <title>Dashboard - StudyFlow</title>
  <link rel="stylesheet" href="css/style.css?v=v2026-09-28-01">
</head>
<body>
  <!-- Navigation Containers -->
  <div id="sidebar-container"></div>
  <div id="bottom-nav-container"></div>

  <!-- Main Content -->
  <main class="main-container narrow-layout">
    <!-- Compact Page Header -->
    <header class="page-header">
      <div class="page-header-title-group">
        <h1 id="greeting">Good day!</h1>
        <p class="subtitle" id="date-display"></p>
      </div>
    </header>

    <!-- Hero "Today" Card -->
    <section class="card mb-md" id="hero-task-card">
      <div class="card-header">
        <span class="badge">Next Task</span>
        <span id="hero-task-subject" class="badge">General</span>
      </div>
      <div class="mb-md">
        <h2 id="hero-task-title" class="mb-xs">No pending tasks for today</h2>
        <p id="hero-task-meta" class="text-secondary">Take a break or add a task to get started.</p>
      </div>
      <a href="timer.html" id="hero-start-focus-btn" class="btn btn-primary w-full">Start Focus</a>
    </section>

    <!-- Single Compact Row for Streak, XP & Weekly Progress -->
    <section class="grid-3 mb-lg">
      <!-- Streak -->
      <div class="stat-pill">
        <div class="stat-pill-icon">🔥</div>
        <div>
          <div class="stat-pill-value" id="streak-count">0</div>
          <div class="stat-pill-label">Day Streak</div>
        </div>
      </div>

      <!-- XP -->
      <div class="stat-pill">
        <div class="stat-pill-icon">⚡</div>
        <div>
          <div class="stat-pill-value" id="xp-value-display">0 XP</div>
          <div class="stat-pill-label"><span id="xp-rank-name">Novice</span> (Lvl <span id="xp-level">1</span>)</div>
        </div>
      </div>

      <!-- Weekly Progress -->
      <div class="stat-pill">
        <div class="stat-pill-icon">📊</div>
        <div>
          <div class="stat-pill-value" id="progress-percentage">0%</div>
          <div class="stat-pill-label">Weekly Goal</div>
        </div>
      </div>
    </section>

    <!-- Collapsible Sections -->

    <!-- 1. Upcoming (Open by Default) -->
    <section class="collapsible-section open">
      <div class="collapsible-header">
        <h3>Upcoming Tasks</h3>
        <svg class="collapsible-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="collapsible-content">
        <div id="deadlines-list" class="flex flex-col gap-xs">
          <!-- Populated by JS -->
        </div>
      </div>
    </section>

    <!-- 2. Today's Plan (Closed by Default) -->
    <section class="collapsible-section">
      <div class="collapsible-header">
        <h3>Today's Schedule</h3>
        <svg class="collapsible-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="collapsible-content">
        <div id="today-plan-list" class="flex flex-col gap-xs">
          <!-- Populated by Scheduler -->
        </div>
      </div>
    </section>

    <!-- 3. Subject Mastery (Closed by Default) -->
    <section class="collapsible-section">
      <div class="collapsible-header">
        <h3>Subject Mastery</h3>
        <svg class="collapsible-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="collapsible-content">
        <div id="mastery-overview" class="grid-2-dense">
          <!-- Populated by JS -->
        </div>
      </div>
    </section>

    <!-- Daily Reflection Card (Shown when appropriate) -->
    <section id="reflection-card" class="card mb-lg" style="display:none;">
      <div class="flex items-center justify-between mb-sm">
        <h3>Daily Reflection</h3>
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('reflection-card').style.display='none'" aria-label="Dismiss daily reflection prompt">Dismiss</button>
      </div>
      <p class="text-secondary mb-sm">Record a quick reflection on your progress today.</p>
      <textarea id="reflection-input" class="form-input mb-sm" placeholder="What went well today? What can be improved?" rows="3" aria-label="Daily Reflection"></textarea>
      <button class="btn btn-primary btn-sm" id="save-reflection-btn">Save Reflection</button>
    </section>

    <!-- Hidden containers for progress math compat -->
    <div id="tasks-progress" style="display:none;"></div>
    <div id="hours-progress" style="display:none;"></div>
  </main>

  <!-- Floating Add Task Button -->
  <a href="tasks.html?action=add" id="fab-add-task" class="fab-add-task" aria-label="Add task" title="Add Task">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
  </a>

  <!-- Scripts -->
  <script src="js/storage.js?v=v2026-09-28-01"></script>
  <script src="js/subtask-utils.js?v=v2026-09-28-01"></script>
  <script src="js/pwa-manager.js?v=v2026-09-28-01"></script>
  <script src="js/achievements.js?v=v2026-09-28-01"></script>
  <script src="js/scheduler.js?v=v2026-09-28-01"></script>
  <script src="js/app.js?v=v2026-09-28-01"></script>
  
  <script>
    (function() {
      'use strict';

      function updateGreeting() {
        const hour = new Date().getHours();
        const greetingEl = document.getElementById('greeting');
        const user = Storage.getUser();
        let greeting = hour < 12 ? 'Good morning' : (hour < 18 ? 'Good afternoon' : 'Good evening');
        greetingEl.textContent = `${greeting}, ${user.name}!`;
      }

      function updateDateDisplay() {
        const dateEl = document.getElementById('date-display');
        const options = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' };
        dateEl.textContent = new Date().toLocaleDateString('en-US', options);
      }

      function updateHeroTask() {
        const todayTasks = Storage.getTodayTasks();
        const pending = todayTasks.filter(t => !t.completed);
        const heroTitle = document.getElementById('hero-task-title');
        const heroMeta = document.getElementById('hero-task-meta');
        const heroSubject = document.getElementById('hero-task-subject');
        const heroBtn = document.getElementById('hero-start-focus-btn');

        if (pending.length > 0) {
          const task = pending[0];
          heroTitle.textContent = task.title;
          heroMeta.textContent = `Due: ${task.dueDate ? Storage.formatDisplayDate(task.dueDate) : 'Today'} • ${task.subject}`;
          heroSubject.textContent = task.subject;
          heroBtn.textContent = 'Start Focus';
          heroBtn.href = `timer.html?taskId=${encodeURIComponent(task.id)}`;
        } else {
          heroTitle.textContent = 'All clear for today!';
          heroMeta.textContent = 'No pending tasks scheduled.';
          heroSubject.textContent = 'Done';
          heroBtn.textContent = 'Start Timer';
          heroBtn.href = 'timer.html';
        }
      }

      function updateStats() {
        const stats = Storage.getStats();
        document.getElementById('streak-count').textContent = stats.streak || 0;
      }

      function updateProgress() {
        const goals = Storage.getGoals();
        const tasksPercentage = goals.weekly_tasks > 0 ? Math.round((goals.current_tasks / goals.weekly_tasks) * 100) : 0;
        const hoursPercentage = goals.weekly_hours > 0 ? (goals.current_hours / goals.weekly_hours * 100) : 0;
        const avgPercentage = Math.round((tasksPercentage + hoursPercentage) / 2);
        document.getElementById('progress-percentage').textContent = `${Math.min(100, avgPercentage)}%`;
      }

      function updateMasteryOverview() {
        const masteryEl = document.getElementById('mastery-overview');
        const stats = Storage.getSubjectMasteryStats();
        if (stats.length === 0) {
          masteryEl.innerHTML = '<p class="text-secondary text-center p-sm">No subjects defined</p>';
          return;
        }
        masteryEl.innerHTML = stats.map(subject => `
          <a href="tasks.html?subject=${encodeURIComponent(subject.name)}" class="card u-no-underline p-sm">
            <div class="flex items-center justify-between mb-xs">
              <span style="font-size:13px;font-weight:500;color:var(--text-primary);">${App.escapeHtml(subject.name)}</span>
              <span style="font-size:12px;color:var(--accent-text);font-weight:500;">${subject.percentage}%</span>
            </div>
            <div class="progress-bar-bg" style="height:4px;">
              <div class="progress-bar-fill" style="width:${subject.percentage}%;"></div>
            </div>
          </a>
        `).join('');
      }

      function updateXPWidget() {
        const xpState = Storage.loadData(Storage.KEYS.XP_STATE, Storage.DEFAULTS.xpState);
        const level = Achievements.calculateLevel(xpState.totalXP);
        const rank = Achievements.getRank(xpState.totalXP);

        document.getElementById('xp-level').textContent = level;
        document.getElementById('xp-rank-name').textContent = rank.title;
        document.getElementById('xp-value-display').textContent = `${xpState.totalXP} XP`;
      }

      function updateTodayPlan() {
        const plan = Scheduler.generatePlan();
        const planList = document.getElementById('today-plan-list');

        if (plan.length === 0) {
          planList.innerHTML = '<p class="text-secondary text-center p-sm">No sessions scheduled for today.</p>';
          return;
        }

        planList.innerHTML = plan.map(block => {
          const href = block.taskId ? `timer.html?taskId=${App.escapeHtml(block.taskId)}` : 'timer.html';
          return `
            <a href="${href}" class="flex items-center justify-between p-sm u-no-underline card">
              <div>
                <div style="font-size:13px;font-weight:500;color:var(--text-primary);">${App.escapeHtml(block.label)}</div>
                <div style="font-size:11px;color:var(--text-muted);">${App.escapeHtml(block.subject || 'General')}</div>
              </div>
              <div style="font-size:12px;font-weight:500;color:var(--accent-text);">${App.escapeHtml(block.startTime)} - ${App.escapeHtml(block.endTime)}</div>
            </a>
          `;
        }).join('');
      }

      function updateDeadlines() {
        const deadlinesEl = document.getElementById('deadlines-list');
        const upcomingTasks = Storage.getUpcomingTasks(7);
        if (upcomingTasks.length === 0) {
          deadlinesEl.innerHTML = '<p class="text-secondary text-center p-sm">No upcoming tasks for the next 7 days.</p>';
          return;
        }
        deadlinesEl.innerHTML = upcomingTasks.slice(0, 5).map(task => {
          const isOverdue = !task.completed && task.dueDate && Storage.isDateOverdue(task.dueDate);
          return `
            <a href="timer.html?taskId=${App.escapeHtml(task.id)}" class="card u-no-underline p-sm flex items-center justify-between">
              <div>
                <div style="font-size:13px;font-weight:500;color:var(--text-primary);">${App.escapeHtml(task.title)}</div>
                <div style="font-size:11px;color:var(--text-muted);">${App.escapeHtml(task.subject)}</div>
              </div>
              <div style="font-size:12px;font-weight:500;color:${isOverdue ? 'var(--danger)' : 'var(--accent-text)'};">
                ${Storage.formatDisplayDate(task.dueDate)}
              </div>
            </a>
          `;
        }).join('');
      }

      function setupCollapsibles() {
        document.querySelectorAll('.collapsible-header').forEach(header => {
          header.onclick = () => {
            header.closest('.collapsible-section').classList.toggle('open');
          };
        });
      }

      function init() {
        PWAManager.init();
        updateGreeting();
        updateDateDisplay();
        updateHeroTask();
        updateStats();
        updateProgress();
        updateMasteryOverview();
        updateDeadlines();
        updateXPWidget();
        updateTodayPlan();
        setupCollapsibles();
        checkReflectionStatus();
        Achievements.init();
      }

      function checkReflectionStatus() {
        const now = new Date();
        if (now.getHours() >= 21) {
          const todayStr = Storage.formatDate(now);
          const reflections = Storage.loadData(Storage.KEYS.REFLECTIONS, []);
          if (!reflections.some(r => r.date === todayStr)) {
            document.getElementById('reflection-card').style.display = 'block';
          }
        }
      }

      document.getElementById('save-reflection-btn')?.addEventListener('click', () => {
        const inputEl = document.getElementById('reflection-input');
        const text = inputEl ? inputEl.value.trim() : '';
        if (text) {
          const reflections = Storage.loadData(Storage.KEYS.REFLECTIONS, []);
          reflections.push({
            date: Storage.formatDate(new Date()),
            text: text,
            timestamp: new Date().toISOString()
          });
          Storage.saveData(Storage.KEYS.REFLECTIONS, reflections);
          App.showToast('Reflection saved', 'success');
          document.getElementById('reflection-card').style.display = 'none';
        } else {
          App.showToast('Please enter a reflection before saving', 'warning');
          inputEl?.focus();
        }
      });
      init();

      window.addEventListener('studyflow_taskDataChanged', () => {
        updateHeroTask();
        updateStats();
        updateMasteryOverview();
        updateDeadlines();
        updateXPWidget();
        updateTodayPlan();
      });
    })();
  </script>
</body>
</html>
