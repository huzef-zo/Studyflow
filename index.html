<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="description" content="StudyFlow - Your personal study organizer and productivity hub">
  <meta name="theme-color" content="#0A0B0F">
  
  <!-- Standalone PWA Configuration -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StudyFlow">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-touch-fullscreen" content="yes">
  <meta name="web-app-capable" content="yes">
  
  <!-- Icons -->
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="shortcut icon" type="image/png" href="./icon-192.png">
  
  <!-- Manifest -->
  <link rel="manifest" href="./manifest.json">
  <link rel="msapplication-config" href="browserconfig.xml">
  <meta name="msapplication-TileColor" content="#5B9BF0">
  
  <title>Dashboard - StudyFlow</title>
  <link rel="stylesheet" href="css/style.css?v=v2026-09-30-01">
</head>
<body>
  <!-- Navigation Containers -->
  <div id="sidebar-container"></div>
  <div id="bottom-nav-container"></div>

  <!-- Floating Add Task Button -->
  <a href="tasks.html?action=add" class="fab-btn" aria-label="Add task" title="Add task">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
  </a>

  <!-- Main Content -->
  <main class="main-container">
    <!-- Top Bar Header -->
    <div id="global-top-bar" class="flex items-center justify-between w-full mb-md">
      <div class="top-bar-brand">
        <div class="top-bar-logo">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </div>
        <span class="top-bar-title">StudyFlow</span>
      </div>
      <a href="settings.html" class="user-avatar-circle" id="top-user-avatar" title="Settings" aria-label="User settings">
        SF
      </a>
    </div>

    <!-- Page Header -->
    <header class="page-header animate-fade-in mb-md">
      <div class="page-header-title-group">
        <p class="subtitle" id="date-display" style="font-size:12px;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-muted);"></p>
        <h1 id="greeting">Good evening</h1>
      </div>
    </header>

    <!-- NEXT UP Hero Card -->
    <section id="next-up-hero" class="hero-card mb-md animate-fade-in">
      <!-- Populated by JS -->
    </section>

    <!-- 3 Compact Tiles -->
    <section class="grid-3 mb-md animate-fade-in">
      <!-- Streak Tile -->
      <div class="card p-sm">
        <div class="flex items-center justify-between mb-xs">
          <span style="font-size:11px;text-transform:uppercase;color:var(--text-muted);font-weight:600;">Streak</span>
          <span id="streak-active-chip" class="badge" style="font-size:10px;background:rgba(91,155,240,0.12);color:var(--accent-text);display:none;">+1 Today</span>
        </div>
        <div class="flex items-baseline gap-xs">
          <span class="data-number" id="streak-count">0</span>
          <span style="font-size:12px;color:var(--text-muted);">days</span>
        </div>
      </div>

      <!-- Level & XP Tile -->
      <div class="card p-sm">
        <div class="flex items-center justify-between mb-xs">
          <span style="font-size:11px;text-transform:uppercase;color:var(--text-muted);font-weight:600;" id="xp-rank-name">Lvl 1</span>
          <span style="font-size:10px;color:var(--text-muted);" id="xp-value-display">0 XP</span>
        </div>
        <div class="progress-bar-bg mb-xs" style="height:4px;">
          <div id="xp-progress-fill" class="progress-bar-fill" style="width: 0%;"></div>
        </div>
        <div style="font-size:11px;color:var(--text-secondary);" id="xp-level-text">Level 1 Novice</div>
      </div>

      <!-- Weekly Goal Tile -->
      <div class="card p-sm">
        <div class="flex items-center justify-between mb-xs">
          <span style="font-size:11px;text-transform:uppercase;color:var(--text-muted);font-weight:600;">Weekly Goal</span>
          <span style="font-size:10px;color:var(--accent-text);" id="weekly-goal-percent">0%</span>
        </div>
        <div class="flex items-baseline gap-xs">
          <span class="data-number" id="weekly-goal-count">0</span>
          <span style="font-size:12px;color:var(--text-muted);" id="weekly-goal-target">of 10 tasks</span>
        </div>
      </div>
    </section>

    <!-- Upcoming Section -->
    <section class="card mb-md animate-fade-in">
      <div class="card-header mb-sm">
        <div class="flex items-center gap-sm">
          <h2 style="font-size:16px;">Upcoming</h2>
          <span class="badge" id="upcoming-count-badge">0 pending</span>
        </div>
        <a href="tasks.html" class="btn btn-ghost btn-sm" style="font-size:12px;">View all</a>
      </div>
      <div id="upcoming-tasks-list" class="flex flex-col gap-xs">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- Collapsed Sections under Upcoming -->
    <details class="card mb-md animate-fade-in">
      <summary class="card-title" style="cursor:pointer;user-select:none;color:var(--text-secondary);">Today's Optimized Plan</summary>
      <div id="today-plan-list" class="flex flex-col gap-xs mt-sm">
        <!-- Populated by Scheduler -->
      </div>
    </details>

    <details class="card mb-md animate-fade-in">
      <summary class="card-title" style="cursor:pointer;user-select:none;color:var(--text-secondary);">Sector Mastery Overview</summary>
      <div id="mastery-overview" class="grid-2 mt-sm">
        <!-- Populated by JS -->
      </div>
    </details>

    <!-- Daily Reflection -->
    <section id="reflection-card" class="card mb-md animate-fade-in" style="display:none;">
      <div class="flex items-center justify-between mb-md">
        <h3 class="card-title" style="margin: 0;">Daily Reflection</h3>
        <button class="btn btn-ghost btn-sm" onclick="this.closest('#reflection-card').style.display='none'" aria-label="Dismiss daily reflection prompt">Dismiss</button>
      </div>
      <p class="text-secondary mb-md">Take a moment to record your progress today.</p>
      <textarea id="reflection-input" class="form-input mb-md" placeholder="How was your progress today?" style="height:80px;" aria-label="Daily Reflection"></textarea>
      <button class="btn btn-primary" id="save-reflection-btn">Save Reflection</button>
    </section>
  </main>

  <!-- Scripts -->
  <script src="js/storage.js?v=v2026-09-30-01"></script>
  <script src="js/subtask-utils.js?v=v2026-09-30-01"></script>
  <script src="js/pwa-manager.js?v=v2026-09-30-01"></script>
  <script src="js/achievements.js?v=v2026-09-30-01"></script>
  <script src="js/scheduler.js?v=v2026-09-30-01"></script>
  <script src="js/app.js?v=v2026-09-30-01"></script>

  <script>
    (function() {
      'use strict';

      function getUserInitials(name) {
        if (!name || typeof name !== 'string') return 'SF';
        const parts = name.trim().split(/\s+/).filter(Boolean);
        if (parts.length === 0) return 'SF';
        if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      }

      function updateHeaderUser() {
        const user = Storage.getUser();
        const hour = new Date().getHours();
        const greetingEl = document.getElementById('greeting');
        let greeting = hour < 12 ? 'Good morning' : (hour < 18 ? 'Good afternoon' : 'Good evening');
        greetingEl.textContent = `${greeting}, ${user.name}!`;

        const avatarEl = document.getElementById('top-user-avatar');
        if (avatarEl) {
          avatarEl.textContent = getUserInitials(user.name);
          avatarEl.setAttribute('aria-label', `User settings: ${user.name}`);
        }

        const dateEl = document.getElementById('date-display');
        const options = { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' };
        dateEl.textContent = new Date().toLocaleDateString('en-US', options);
      }

      function renderNextUpHero() {
        const heroEl = document.getElementById('next-up-hero');
        const tasks = Storage.getTasks().filter(t => !t.completed);
        const todayStr = Storage.formatDate(new Date());

        const pendingTasks = tasks.filter(t => {
          if (t.type === 'repeating') return !Storage.isRepeatingTaskCompletedOnDate(t.id, todayStr);
          return !t.completed;
        });

        if (pendingTasks.length === 0) {
          heroEl.innerHTML = `
            <div class="text-center py-sm">
              <span style="font-size:10px;text-transform:uppercase;color:var(--text-muted);font-weight:600;letter-spacing:0.04em;">NEXT UP</span>
              <h3 style="font-size:16px;margin:8px 0;color:var(--text-primary);">All clear for today!</h3>
              <p style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">No pending tasks. Take a break or add a new goal.</p>
              <a href="tasks.html?action=add" class="btn btn-secondary btn-sm">+ Add Task</a>
            </div>
          `;
          return;
        }

        const nextTask = pendingTasks[0];
        const subjectColor = App.getSubjectColor(nextTask.subject);

        heroEl.innerHTML = `
          <div class="flex items-center justify-between mb-xs">
            <span style="font-size:10px;text-transform:uppercase;color:var(--text-muted);font-weight:600;letter-spacing:0.04em;">NEXT UP</span>
            <span class="badge" style="font-size:11px;background:rgba(91,155,240,0.12);color:var(--accent-text);border:none;">
              ${nextTask.dueTime ? App.escapeHtml(nextTask.dueTime) : 'Due Today'}
            </span>
          </div>

          <h2 style="font-size:18px;margin-bottom:8px;color:var(--text-primary);">${App.escapeHtml(nextTask.title)}</h2>

          <div class="flex items-center gap-sm mb-md">
            <span class="subject-tag" style="background:rgba(${App.hexToRgb(subjectColor)}, 0.12);color:${subjectColor};">
              <span style="width:6px;height:6px;border-radius:50%;background:${subjectColor};"></span>
              ${App.escapeHtml(nextTask.subject)}
            </span>
          </div>

          <div class="flex items-center justify-between gap-sm">
            <a href="timer.html?taskId=${App.escapeHtml(nextTask.id)}" class="btn btn-primary flex-1">
              Start focus
            </a>
            <button class="btn btn-secondary btn-icon" id="hero-complete-btn" aria-label="Complete task" title="Complete task">
              ✓
            </button>
          </div>
        `;

        document.getElementById('hero-complete-btn')?.addEventListener('click', () => {
          if (nextTask.type === 'repeating') {
            Storage.setRepeatingTaskCompletedOnDate(nextTask.id, todayStr, true);
          } else {
            Storage.completeTask(nextTask.id);
          }
          App.showToast('Task completed!', 'success');
          renderNextUpHero();
          renderUpcomingList();
          updateStatsAndTiles();
        });
      }

      function renderUpcomingList() {
        const listEl = document.getElementById('upcoming-tasks-list');
        const badgeEl = document.getElementById('upcoming-count-badge');
        const tasks = Storage.getTasks();
        const todayStr = Storage.formatDate(new Date());

        const pending = tasks.filter(t => {
          if (t.type === 'repeating') return !Storage.isRepeatingTaskCompletedOnDate(t.id, todayStr);
          return !t.completed;
        });

        badgeEl.textContent = `${pending.length} pending`;

        if (pending.length === 0) {
          listEl.innerHTML = '<p class="text-muted text-center py-sm" style="font-size:13px;">No upcoming tasks.</p>';
          return;
        }

        listEl.innerHTML = pending.slice(0, 5).map(task => {
          const subjectColor = App.getSubjectColor(task.subject);
          return `
            <div class="flex items-center gap-md p-xs" style="border-radius:12px;background:var(--bg-surface);">
              <div class="task-checkbox" data-id="${App.escapeHtml(task.id)}" tabindex="0" role="checkbox" aria-checked="false" aria-label="Mark complete: ${App.escapeHtml(task.title)}"></div>
              <div class="flex-1 min-w-0">
                <div style="font-size:14px;font-weight:500;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${App.escapeHtml(task.title)}</div>
                <div style="font-size:11px;color:var(--text-muted);">${App.escapeHtml(task.subject)} • ${task.dueDate ? Storage.formatDisplayDate(task.dueDate) : 'Today'}</div>
              </div>
            </div>
          `;
        }).join('');

        listEl.querySelectorAll('.task-checkbox').forEach(cb => {
          cb.onclick = () => {
            const id = cb.dataset.id;
            const t = Storage.getTaskById(id);
            if (t.type === 'repeating') {
              Storage.setRepeatingTaskCompletedOnDate(id, todayStr, true);
            } else {
              Storage.completeTask(id);
            }
            App.showToast('Task completed!', 'success');
            renderNextUpHero();
            renderUpcomingList();
            updateStatsAndTiles();
          };
        });
      }

      function updateStatsAndTiles() {
        const stats = Storage.getStats();
        const goals = Storage.getGoals();

        // Streak
        document.getElementById('streak-count').textContent = stats.streak || 0;
        const activeToday = stats.tasks.todayCompleted > 0;
        document.getElementById('streak-active-chip').style.display = activeToday ? 'inline-block' : 'none';

        // XP & Level
        const xpState = Storage.loadData(Storage.KEYS.XP_STATE, Storage.DEFAULTS.xpState);
        const level = Achievements.calculateLevel(xpState.totalXP);
        const rank = Achievements.getRank(xpState.totalXP);
        const nextLevelXP = Achievements.getXPForLevel(level + 1);
        const currentLevelXP = Achievements.getXPForLevel(level);
        const percentage = Math.min(100, Math.round(((xpState.totalXP - currentLevelXP) / (nextLevelXP - currentLevelXP)) * 100));

        document.getElementById('xp-rank-name').textContent = `Lvl ${level}`;
        document.getElementById('xp-value-display').textContent = `${xpState.totalXP} XP`;
        document.getElementById('xp-progress-fill').style.width = `${percentage}%`;
        document.getElementById('xp-level-text').textContent = `Level ${level} ${rank.title}`;

        // Weekly Goal
        const completed = goals.current_tasks || 0;
        const target = goals.weekly_tasks || 10;
        const goalPercent = target > 0 ? Math.min(100, Math.round((completed / target) * 100)) : 0;
        document.getElementById('weekly-goal-percent').textContent = `${goalPercent}%`;
        document.getElementById('weekly-goal-count').textContent = completed;
        document.getElementById('weekly-goal-target').textContent = `of ${target} tasks`;
      }

      function updateMasteryOverview() {
        const masteryEl = document.getElementById('mastery-overview');
        const stats = Storage.getSubjectMasteryStats();
        if (stats.length === 0) {
          masteryEl.innerHTML = '<p class="text-muted text-center" style="grid-column: 1 / -1;font-size:12px;">No subjects defined.</p>';
          return;
        }
        masteryEl.innerHTML = stats.map(subject => `
          <div class="card p-xs" style="background:var(--bg-raised);">
            <div class="flex items-center justify-between mb-xs">
              <span style="font-size:12px;font-weight:500;color:var(--text-primary);">${App.escapeHtml(subject.name)}</span>
              <span style="font-size:11px;color:var(--accent-text);">${subject.percentage}%</span>
            </div>
            <div class="progress-bar-bg" style="height:4px;">
              <div class="progress-bar-fill" style="width:${subject.percentage}%;"></div>
            </div>
          </div>
        `).join('');
      }

      function updateTodayPlan() {
        const plan = Scheduler.generatePlan();
        const planList = document.getElementById('today-plan-list');
        if (plan.length === 0) {
          planList.innerHTML = '<p class="text-muted text-center py-sm" style="font-size:12px;">No sessions scheduled for today.</p>';
          return;
        }
        planList.innerHTML = plan.map(block => `
          <div class="flex items-center gap-sm p-xs" style="border-radius:8px;background:var(--bg-raised);">
            <span style="font-size:11px;color:var(--accent-text);min-width:70px;">${App.escapeHtml(block.startTime)}</span>
            <span style="font-size:12px;color:var(--text-primary);flex:1;">${App.escapeHtml(block.label)}</span>
          </div>
        `).join('');
      }

      function checkReflectionStatus() {
        const now = new Date();
        if (now.getHours() >= 21) {
          const todayStr = Storage.formatDate(now);
          const reflections = Storage.loadData(Storage.KEYS.REFLECTIONS, []);
          if (!reflections.some(r => r.date === todayStr)) {
            document.getElementById('reflection-card').style.display = 'block';
          }
        }
      }

      function init() {
        PWAManager.init();
        updateHeaderUser();
        renderNextUpHero();
        renderUpcomingList();
        updateStatsAndTiles();
        updateMasteryOverview();
        updateTodayPlan();
        checkReflectionStatus();
        Achievements.init();
      }

      document.getElementById('save-reflection-btn')?.addEventListener('click', () => {
        const inputEl = document.getElementById('reflection-input');
        const text = inputEl ? inputEl.value.trim() : '';
        if (text) {
          const reflections = Storage.loadData(Storage.KEYS.REFLECTIONS, []);
          reflections.push({
            date: Storage.formatDate(new Date()),
            text: text,
            timestamp: new Date().toISOString()
          });
          Storage.saveData(Storage.KEYS.REFLECTIONS, reflections);
          App.showToast('Reflection saved!', 'success');
          document.getElementById('reflection-card').style.display = 'none';
        } else {
          App.showToast('Please enter a reflection before saving', 'warning');
          inputEl?.focus();
        }
      });

      init();

      window.addEventListener('studyflow_taskDataChanged', () => {
        renderNextUpHero();
        renderUpcomingList();
        updateStatsAndTiles();
        updateMasteryOverview();
        updateTodayPlan();
      });
    })();
  </script>
</body>
</html>
