<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="description" content="StudyFlow - Knowledge vault for study notes">
  <meta name="theme-color" content="#0A0B0F">

  <!-- Standalone PWA Configuration -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StudyFlow">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-touch-fullscreen" content="yes">

  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="msapplication-config" href="browserconfig.xml">
  <meta name="msapplication-TileColor" content="#5B9BF0">

  <title>Notes - StudyFlow</title>
  <link rel="stylesheet" href="css/style.css?v=v2026-09-30-01">
  <style>
    .notes-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: var(--spacing-md);
      min-height: 500px;
    }

    @media (max-width: 768px) {
      .notes-layout {
        grid-template-columns: 1fr;
      }
    }

    .notes-sidebar {
      background: var(--bg-surface);
      border-radius: var(--radius-card);
      border: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .notes-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .note-card {
      padding: 12px 14px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: var(--transition);
      margin-bottom: 8px;
      background: var(--bg-raised);
      border: 1px solid var(--glass-border);
      position: relative;
    }

    .note-card:hover {
      border-color: var(--accent-fill);
    }

    .note-card.active {
      border-color: var(--accent-fill);
      background: rgba(91, 155, 240, 0.12);
    }

    .note-editor {
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: var(--bg-surface);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      padding: 20px;
    }

    .note-content-area {
      flex: 1;
      min-height: 350px;
      font-family: inherit;
      line-height: 1.5;
      background: var(--bg-deep);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 14px;
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>
  <div id="bottom-nav-container"></div>

  <main class="main-container">
    <!-- Top Bar Header -->
    <div id="global-top-bar" class="flex items-center justify-between w-full mb-md">
      <div class="top-bar-brand">
        <div class="top-bar-logo">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </div>
        <span class="top-bar-title">StudyFlow</span>
      </div>
      <a href="settings.html" class="user-avatar-circle" id="top-user-avatar" title="Settings" aria-label="User settings">
        SF
      </a>
    </div>

    <!-- Page Header -->
    <header class="page-header animate-fade-in">
      <div class="page-header-title-group">
        <div class="flex items-center gap-sm">
          <h1>Notes</h1>
          <span class="badge" id="notes-count-badge">0 notes</span>
        </div>
        <p class="subtitle">Secure storage for academic intelligence</p>
      </div>
      <div class="page-header-actions flex items-center gap-sm flex-wrap">
        <button class="btn btn-primary" id="new-note-btn" aria-label="Create new note entry">
          + New Note
        </button>
      </div>
    </header>

    <!-- Search Bar & Filter Chips -->
    <div class="flex flex-col gap-sm mb-md animate-fade-in">
      <input type="text" id="search-notes" class="form-input" placeholder="Search title, content, or tags... (Ctrl+K)" aria-label="Search notes">
      <div class="filter-tabs flex gap-xs" id="notes-subject-filters" role="tablist" aria-label="Filter notes by subject">
        <!-- Populated by JS -->
      </div>
    </div>

    <div class="notes-layout animate-fade-in">
      <aside class="notes-sidebar">
        <div class="notes-list" id="notes-list">
          <!-- Populated by JS -->
        </div>
      </aside>

      <section class="note-editor" id="note-editor" style="display: none;">
        <div class="flex items-center justify-between gap-md flex-wrap">
          <input type="text" id="note-title" class="form-input" style="font-size: 16px; font-weight: 600; border: none; background: none; padding-left: 0; flex:1;" placeholder="Note Title" maxlength="200" aria-label="Note Title">
          <div class="flex items-center gap-sm">
            <select id="note-subject" class="form-select" style="width: auto; font-size:12px; height:36px; padding:0 28px 0 12px; border-radius:9999px;" aria-label="Note Subject"></select>
            <button class="btn btn-danger btn-sm" id="delete-note-btn" aria-label="Delete note">Delete</button>
            <button class="btn btn-primary btn-sm" id="save-note-btn" aria-label="Save note (Ctrl+S)" title="Save note (Ctrl+S)">Save</button>
          </div>
        </div>
        <textarea id="note-content" class="form-input note-content-area" placeholder="Write your notes... (Markdown supported)" maxlength="10000" aria-label="Note Content"></textarea>
      </section>

      <div id="empty-editor-state" class="flex-1 flex items-center justify-center card">
        <div class="text-center p-lg">
          <div style="font-size: 2rem; color: var(--text-muted); margin-bottom: 0.5rem;">📝</div>
          <h3 style="color: var(--text-muted);">Select or create a note</h3>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/storage.js?v=v2026-09-30-01"></script>
  <script src="js/subtask-utils.js?v=v2026-09-30-01"></script>
  <script src="js/pwa-manager.js?v=v2026-09-30-01"></script>
  <script src="js/achievements.js?v=v2026-09-30-01"></script>
  <script src="js/app.js?v=v2026-09-30-01"></script>
  <script src="js/notes.js?v=v2026-09-30-01"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      PWAManager.init();
      Notes.init();
    });
  </script>
</body>
</html>
