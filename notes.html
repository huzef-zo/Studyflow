<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="description" content="StudyFlow - Notes and study materials">
  <meta name="theme-color" content="#121314">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StudyFlow">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-touch-fullscreen" content="yes">

  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="msapplication-config" href="browserconfig.xml">
  <meta name="msapplication-TileColor" content="#3B6FD8">

  <title>Notes - StudyFlow</title>
  <link rel="stylesheet" href="css/style.css?v=v2026-09-28-01">
</head>
<body>
  <!-- Navigation Containers -->
  <div id="sidebar-container"></div>
  <div id="bottom-nav-container"></div>

  <!-- Main Content -->
  <main class="main-container narrow-layout">
    <!-- Page Header -->
    <header class="page-header">
      <div class="page-header-title-group">
        <h1>Notes</h1>
        <p class="subtitle">Manage notes and study material</p>
      </div>
      <div class="page-header-actions flex items-center gap-sm flex-wrap">
        <button class="btn btn-primary" id="new-note-btn" aria-label="Create new note entry">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
          New Note
        </button>
      </div>
    </header>

    <div class="grid-2 gap-md">
      <!-- Notes Sidebar / List -->
      <aside class="card p-0 flex flex-col">
        <div class="p-sm" style="border-bottom: 1px solid var(--border-color);">
          <input type="text" id="search-notes" class="form-input" placeholder="Search notes... (Ctrl+K)" aria-label="Search notes">
        </div>
        <div class="p-sm flex flex-col gap-xs" id="notes-list" style="max-height: 400px; overflow-y: auto;">
          <!-- Populated by JS -->
        </div>
      </aside>

      <!-- Note Editor -->
      <section class="card flex flex-col gap-md" id="note-editor" style="display: none;">
        <div class="flex items-center justify-between gap-md flex-wrap">
          <input type="text" id="note-title" class="form-input" style="font-size: var(--font-size-md); font-weight: 600; border: none; background: none; padding-left: 0;" placeholder="Note Title" maxlength="200" aria-label="Note Title">
          <div class="flex items-center gap-sm">
            <select id="note-subject" class="form-select" style="width: auto;" aria-label="Note Subject"></select>
            <button class="btn btn-danger btn-sm" id="delete-note-btn" aria-label="Delete note entry">Delete</button>
            <button class="btn btn-primary btn-sm" id="save-note-btn" aria-label="Save note entry (Ctrl+S)" title="Save note (Ctrl+S)">Save</button>
          </div>
        </div>
        <textarea id="note-content" class="form-input" style="min-height: 280px; resize: vertical;" placeholder="Write your notes... (Markdown supported)" maxlength="10000" aria-label="Note Content"></textarea>
      </section>

      <!-- Empty Editor Placeholder -->
      <div id="empty-editor-state" class="card flex items-center justify-center p-xl">
        <div class="text-center">
          <div style="font-size: 2rem; color: var(--text-muted);" class="mb-xs">📑</div>
          <h3 style="color: var(--text-muted); font-size: var(--font-size-sm);">Select or create a note</h3>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/storage.js?v=v2026-09-28-01"></script>
  <script src="js/subtask-utils.js?v=v2026-09-28-01"></script>
  <script src="js/pwa-manager.js?v=v2026-09-28-01"></script>
  <script src="js/achievements.js?v=v2026-09-28-01"></script>
  <script src="js/app.js?v=v2026-09-28-01"></script>
  <script src="js/notes.js?v=v2026-09-28-01"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      PWAManager.init();
      Notes.init();
    });
  </script>
</body>
</html>
