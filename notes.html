<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="description" content="StudyFlow - Knowledge vault for study notes">
  <meta name="theme-color" content="#14161B">

  <!-- Standalone PWA Configuration -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StudyFlow">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-touch-fullscreen" content="yes">

  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="msapplication-config" href="browserconfig.xml">
  <meta name="msapplication-TileColor" content="#5B9BF0">

  <title>Notes - StudyFlow</title>
  <link rel="stylesheet" href="css/style.css?v=v2025-05-03-03">
  <link rel="stylesheet" href="css/blocks.css?v=v2025-05-03-03">
  <style>
    .notes-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: var(--spacing-md);
      min-height: 500px;
    }

    @media (max-width: 768px) {
      .notes-layout {
        grid-template-columns: 1fr;
      }
    }

    .notes-sidebar {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .notes-list {
      flex: 1;
      overflow-y: auto;
      padding: var(--spacing-sm);
    }

    .note-editor {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      padding: var(--spacing-md);
    }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>
  <div id="bottom-nav-container"></div>

  <main class="main-container">
    <header class="page-header animate-fade-in">
      <div class="page-header-title-group">
        <h1>Knowledge Vault</h1>
        <p class="subtitle">Secure workspace for academic intelligence</p>
      </div>
      <div class="page-header-actions flex items-center gap-sm flex-wrap">
        <button class="btn btn-secondary" id="template-gallery-btn" aria-label="Open Template Gallery">
          ✨ Templates
        </button>
        <button class="btn btn-primary" id="new-note-btn" aria-label="Create new page entry">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
          New Page
        </button>
      </div>
    </header>

    <div class="notes-layout animate-fade-in">
      <aside class="notes-sidebar">
        <div class="p-sm" style="border-bottom: 1px solid var(--border-color);">
          <input type="text" id="search-notes" class="form-input glass-pill-input" placeholder="Search pages... (Ctrl+K)" aria-label="Search pages">
        </div>
        <div class="notes-list" id="notes-list">
          <!-- Populated dynamically as tree by JS -->
        </div>
      </aside>

      <section class="note-editor" id="note-editor" style="display: none;">
        <!-- Page Cover Strip -->
        <div id="page-cover-strip" class="page-cover-strip">
          <button id="change-cover-btn" class="page-cover-picker-btn" aria-label="Change cover color">Change Cover</button>
        </div>

        <!-- Page Icon -->
        <div class="page-icon-wrapper">
          <button id="page-icon-btn" class="page-icon-btn" aria-label="Change page icon" title="Click to pick emoji">📄</button>
        </div>

        <div class="flex items-center justify-between gap-md flex-wrap mt-xs">
          <input type="text" id="note-title" class="form-input" style="font-size: 20px; font-weight: 700; border: none; background: none; padding-left: 0;" placeholder="Page Title" maxlength="200" aria-label="Page Title">
          <div class="flex items-center gap-sm">
            <select id="note-subject" class="form-input" style="width: auto;" aria-label="Page Subject"></select>
            <button class="btn btn-secondary btn-sm" id="save-as-template-btn" aria-label="Save as template">Save as Template</button>
            <button class="btn btn-secondary btn-sm" id="add-subpage-btn" aria-label="Add sub-page">+ Sub-page</button>
            <button class="btn btn-danger btn-sm" id="delete-note-btn" aria-label="Delete page entry">Delete</button>
            <button class="btn btn-primary" id="save-note-btn" aria-label="Save page entry (Ctrl+S)" title="Save transmission (Ctrl+S)">Save</button>
          </div>
        </div>

        <!-- Block Editor Container -->
        <div id="note-blocks-container" class="note-editor-blocks">
          <!-- Blocks populated dynamically by js/notes.js -->
        </div>

        <!-- Linked Mentions Container -->
        <div id="linked-mentions-container"></div>
      </section>

      <div id="empty-editor-state" class="flex-1 flex items-center justify-center card">
        <div class="text-center p-lg">
          <div style="font-size: 2.5rem; color: var(--text-muted); margin-bottom: 0.5rem;">📄</div>
          <h3 style="color: var(--text-muted);">Select or create a page</h3>
        </div>
      </div>
    </div>
  </main>

  <script src="js/storage.js?v=v2025-05-03-03"></script>
  <script src="js/blocks.js?v=v2025-05-03-03"></script>
  <script src="js/templates.js?v=v2025-05-03-03"></script>
  <script src="js/subtask-utils.js?v=v2025-05-03-03"></script>
  <script src="js/pwa-manager.js?v=v2025-05-03-03"></script>
  <script src="js/achievements.js?v=v2025-05-03-03"></script>
  <script src="js/app.js?v=v2025-05-03-03"></script>
  <script src="js/notes.js?v=v2025-05-03-03"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      PWAManager.init();
      Notes.init();
    });
  </script>
</body>
</html>
