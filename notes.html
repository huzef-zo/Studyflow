<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="description" content="StudyFlow - Knowledge vault for study notes">
  <meta name="theme-color" content="#14161B">

  <!-- Standalone PWA Configuration -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StudyFlow">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-touch-fullscreen" content="yes">

  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="msapplication-config" href="browserconfig.xml">
  <meta name="msapplication-TileColor" content="#5B9BF0">

  <title>Notes - StudyFlow</title>
  <link rel="stylesheet" href="css/style.css?v=v2025-05-03-02">
  <style>
    .notes-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: var(--spacing-md);
      min-height: 500px;
    }

    @media (max-width: 768px) {
      .notes-layout {
        grid-template-columns: 1fr;
      }
    }

    .notes-sidebar {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .notes-list {
      flex: 1;
      overflow-y: auto;
      padding: var(--spacing-sm);
    }

    .note-item {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      margin-bottom: 6px;
      background: var(--bg-tertiary);
    }

    .note-item:hover {
      opacity: 0.9;
    }

    .note-item.active {
      background: var(--accent-fill);
      color: #FFFFFF;
    }

    .note-editor {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      padding: var(--spacing-md);
    }

    .note-content-area {
      flex: 1;
      min-height: 350px;
      font-family: inherit;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>
  <div id="bottom-nav-container"></div>

  <main class="main-container">
    <header class="page-header animate-fade-in">
      <div class="page-header-title-group">
        <h1>Knowledge Vault</h1>
        <p class="subtitle">Secure storage for academic intelligence</p>
      </div>
      <div class="page-header-actions flex items-center gap-sm flex-wrap">
        <button class="btn btn-primary" id="new-note-btn" aria-label="Create new note entry">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
          New Entry
        </button>
      </div>
    </header>

    <div class="notes-layout animate-fade-in">
      <aside class="notes-sidebar">
        <div class="p-sm" style="border-bottom: 1px solid var(--border-color);">
          <input type="text" id="search-notes" class="form-input glass-pill-input" placeholder="Search vault..." aria-label="Search vault">
        </div>
        <div class="notes-list" id="notes-list">
          <!-- Populated by JS -->
        </div>
      </aside>

      <section class="note-editor" id="note-editor" style="display: none;">
        <div class="flex items-center justify-between gap-md flex-wrap">
          <input type="text" id="note-title" class="form-input" style="font-size: 15px; font-weight: 500; border: none; background: none; padding-left: 0;" placeholder="Note Title" maxlength="200" aria-label="Note Title">
          <div class="flex items-center gap-sm">
            <select id="note-subject" class="form-input" style="width: auto;" aria-label="Note Subject"></select>
            <button class="btn btn-danger btn-sm" id="delete-note-btn">Delete</button>
            <button class="btn btn-primary" id="save-note-btn">Save</button>
          </div>
        </div>
        <textarea id="note-content" class="form-input note-content-area" placeholder="Begin transmission... (Markdown supported)" maxlength="10000" aria-label="Note Content"></textarea>
      </section>

      <div id="empty-editor-state" class="flex-1 flex items-center justify-center card">
        <div class="text-center p-lg">
          <div style="font-size: 2rem; color: var(--text-muted); margin-bottom: 0.5rem;">📑</div>
          <h3 style="color: var(--text-muted);">Select or create an entry</h3>
        </div>
      </div>
    </div>
  </main>

  <script src="js/storage.js?v=v2025-05-03-02"></script>
  <script src="js/subtask-utils.js?v=v2025-05-03-02"></script>
  <script src="js/pwa-manager.js?v=v2025-05-03-02"></script>
  <script src="js/achievements.js?v=v2025-05-03-02"></script>
  <script src="js/app.js?v=v2025-05-03-02"></script>
  <script src="js/notes.js?v=v2025-05-03-02"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      PWAManager.init();
      Notes.init();
    });
  </script>
</body>
</html>
