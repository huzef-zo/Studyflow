<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="description" content="StudyFlow - Calendar View for your study schedule">
  <meta name="theme-color" content="#0A0B0F">
  
  <!-- Standalone PWA Configuration -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StudyFlow">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-touch-fullscreen" content="yes">
  
  <!-- Icons and Manifest -->
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="msapplication-config" href="browserconfig.xml">
  <meta name="msapplication-TileColor" content="#5B9BF0">
  
  <title>Calendar - StudyFlow</title>
  <link rel="stylesheet" href="css/style.css?v=v2026-09-30-01">
</head>
<body>
  <!-- Navigation Containers -->
  <div id="sidebar-container"></div>
  <div id="bottom-nav-container"></div>

  <!-- Floating Add Task Button -->
  <button class="fab-btn" id="fab-add-task-cal" aria-label="Add task" title="Add task">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
  </button>

  <!-- Main Content -->
  <main class="main-container">
    <!-- Top Bar Header -->
    <div id="global-top-bar" class="flex items-center justify-between w-full mb-md">
      <div class="top-bar-brand">
        <div class="top-bar-logo">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </div>
        <span class="top-bar-title">StudyFlow</span>
      </div>
      <a href="settings.html" class="user-avatar-circle" id="top-user-avatar" title="Settings" aria-label="User settings">
        SF
      </a>
    </div>

    <!-- Page Header -->
    <header class="page-header animate-fade-in">
      <div class="page-header-title-group">
        <h1>Calendar</h1>
        <p class="subtitle">Navigate your study timeline</p>
      </div>
    </header>

    <!-- Calendar and Tasks Layout -->
    <div class="narrow-layout calendar-layout">
      
      <!-- Calendar Card -->
      <section class="card animate-fade-in mb-md">
        <div class="flex items-center justify-between mb-md">
          <h2 id="calendar-title" style="font-size: 16px; font-weight: 600;">October 2026</h2>
          <div class="flex items-center gap-xs">
            <button class="btn btn-ghost btn-icon btn-sm" id="prev-month" aria-label="Previous Month">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <button class="btn btn-secondary btn-sm" id="today-btn">Today</button>
            <button class="btn btn-ghost btn-icon btn-sm" id="next-month" aria-label="Next Month">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>
        </div>
        <div class="calendar-grid" id="calendar-grid">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- Selected Day Tasks -->
      <section class="card animate-fade-in mb-md">
        <div class="card-header mb-md">
          <div class="flex items-center gap-sm">
            <h3 class="card-title" id="selected-date-title">Select a date</h3>
            <span class="badge" id="day-tasks-badge" style="display:none;">0 tasks</span>
          </div>
          <button class="btn btn-ghost btn-icon btn-sm" id="add-task-btn" style="display: none;" aria-label="Add task for selected date" title="Add task for selected date">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
          </button>
        </div>
        <div id="day-tasks" class="timeline">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- Footer: Daily Pace -->
      <footer class="card animate-fade-in p-sm text-center" id="daily-pace-footer">
        <!-- Populated by JS -->
      </footer>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/storage.js?v=v2026-09-30-01"></script>
  <script src="js/subtask-utils.js?v=v2026-09-30-01"></script>
  <script src="js/pwa-manager.js?v=v2026-09-30-01"></script>
  <script src="js/achievements.js?v=v2026-09-30-01"></script>
  <script src="js/app.js?v=v2026-09-30-01"></script>
  <script src="js/tasks.js?v=v2026-09-30-01"></script>
  <script src="js/calendar.js?v=v2026-09-30-01"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      PWAManager.init();
      Calendar.init();
      document.getElementById('fab-add-task-cal')?.addEventListener('click', () => {
        if (typeof Tasks !== 'undefined' && Tasks.openTaskModal) {
          Tasks.openTaskModal();
        }
      });
      const user = Storage.getUser();
      const avatarEl = document.getElementById('top-user-avatar');
      if (avatarEl && user) {
        const parts = (user.name || 'SF').trim().split(/\s+/).filter(Boolean);
        const initials = parts.length === 1 ? parts[0].substring(0, 2).toUpperCase() : (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        avatarEl.textContent = initials;
      }
    });
  </script>
</body>
</html>
