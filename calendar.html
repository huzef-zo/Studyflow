<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover"/>
  <meta name="description" content="StudyFlow - Calendar & Temporal Map"/>
  <meta name="theme-color" content="#090D12"/>

  <link rel="icon" type="image/png" href="./icon-192.png"/>
  <link rel="apple-touch-icon" href="./icon-192.png"/>
  <link rel="manifest" href="./manifest.json"/>

  <title>Calendar - StudyFlow</title>
  <link rel="stylesheet" href="css/tailwind.css?v=v2026-09-30-01"/>
  <link rel="stylesheet" href="css/app.css?v=v2026-09-30-01"/>
</head>
<body class="bg-surface-base text-on-surface font-body-md text-body-md flex flex-col relative antialiased selection:bg-primary-container selection:text-surface-base min-h-dvh">
  <!-- Radial Ambient Glow -->
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-lg h-80 bg-[radial-gradient(ellipse_at_top,rgba(91,155,240,0.14),transparent_70%)] pointer-events-none z-0"></div>

  <!-- Shell Containers -->
  <div id="header-container"></div>
  <div id="sidebar-container"></div>
  <div id="bottom-nav-container"></div>
  <div id="fab-container"></div>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col relative w-full max-w-lg lg:max-w-3xl mx-auto pt-20 pb-28 px-margin bg-surface-base z-10">
    <div class="flex flex-col w-full gap-space-lg select-none">

      <!-- Month Switcher Header -->
      <div class="flex items-center justify-between gap-space-sm">
        <div class="flex items-center gap-space-sm">
          <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-text-primary tracking-tight" id="calendar-title">October 2026</h1>
          <button class="px-3 py-1 rounded-full bg-surface-container-high text-primary font-label-sm text-label-sm transition-all active:scale-95 flex items-center gap-1 shadow-sm" id="today-snap-btn" type="button">
            <span class="w-1.5 h-1.5 rounded-full bg-primary-container"></span>
            Today
          </button>
        </div>
        <div class="flex items-center gap-space-xs bg-surface-container-low rounded-full p-1 shadow-inner">
          <button aria-label="Previous Month" class="w-8 h-8 rounded-full flex items-center justify-center text-text-secondary hover:text-text-primary hover:bg-surface-container transition-colors" id="prev-month" type="button">
            <span class="material-symbols-outlined text-[18px]">chevron_left</span>
          </button>
          <button aria-label="Next Month" class="w-8 h-8 rounded-full flex items-center justify-center text-text-secondary hover:text-text-primary hover:bg-surface-container transition-colors" id="next-month" type="button">
            <span class="material-symbols-outlined text-[18px]">chevron_right</span>
          </button>
        </div>
      </div>

      <!-- Calendar Month Grid Card -->
      <div class="flex flex-col w-full bg-surface-container-low/70 backdrop-blur-xl rounded-2xl p-space-md shadow-xl relative overflow-hidden">
        <div class="absolute -top-12 -right-12 w-36 h-36 bg-ambient-glow rounded-full blur-2xl pointer-events-none"></div>

        <!-- Monday-First Weekday Headers -->
        <div class="grid grid-cols-7 mb-space-sm text-center">
          <span class="font-label-sm text-label-sm text-text-muted">M</span>
          <span class="font-label-sm text-label-sm text-text-muted">T</span>
          <span class="font-label-sm text-label-sm text-text-muted">W</span>
          <span class="font-label-sm text-label-sm text-text-muted">T</span>
          <span class="font-label-sm text-label-sm text-text-muted">F</span>
          <span class="font-label-sm text-label-sm text-text-muted">S</span>
          <span class="font-label-sm text-label-sm text-text-muted">S</span>
        </div>

        <!-- Calendar Days Grid -->
        <div class="grid grid-cols-7 gap-y-1 text-center items-center justify-items-center" id="calendar-grid">
          <!-- Injected by JS -->
        </div>
      </div>

      <!-- Agenda Header for Selected Date -->
      <div class="flex items-center justify-between mt-space-xs">
        <div class="flex items-center gap-space-sm">
          <h2 class="font-headline-md text-headline-md text-text-primary tracking-tight" id="selected-date-title">Select a Date</h2>
          <span class="px-2.5 py-0.5 rounded-full bg-surface-container-high text-primary font-label-sm text-label-sm shadow-sm" id="selected-count-badge">0 tasks</span>
        </div>
        <button aria-label="Add task for this date" class="w-8 h-8 rounded-full bg-surface-container-high hover:bg-surface-container text-text-primary flex items-center justify-center transition-transform active:scale-90 shadow-sm" id="add-task-btn" type="button">
          <span class="material-symbols-outlined text-[18px]">add</span>
        </button>
      </div>

      <!-- Agenda Tasks Stream -->
      <div class="flex flex-col w-full gap-space-sm" id="day-tasks">
        <!-- Populated by JS -->
      </div>

      <!-- Daily Pace Summary Footer -->
      <div class="flex items-center justify-between p-space-md rounded-2xl bg-surface-container-lowest/80 backdrop-blur-sm mt-space-xs" id="daily-pace-card">
        <div class="flex items-center gap-space-sm">
          <div class="w-7 h-7 rounded-full bg-primary-container/20 flex items-center justify-center text-primary-container">
            <span class="material-symbols-outlined text-[18px]">check_circle</span>
          </div>
          <div class="flex flex-col">
            <span class="font-label-md text-label-md text-text-primary">Daily Pace</span>
            <span class="font-body-sm text-body-sm text-text-secondary" id="daily-pace-subtext">0 remaining today</span>
          </div>
        </div>
        <div class="flex items-center gap-1 text-primary font-headline-sm text-headline-sm" id="daily-pace-ratio">
          <span>0</span><span class="text-text-muted font-body-md text-body-md">/0</span>
        </div>
      </div>

    </div>
  </main>

  <!-- Core Scripts -->
  <script src="version.js"></script>
  <script src="js/storage.js?v=v2026-09-30-01"></script>
  <script src="js/subtask-utils.js?v=v2026-09-30-01"></script>
  <script src="js/pwa-manager.js?v=v2026-09-30-01"></script>
  <script src="js/app.js?v=v2026-09-30-01"></script>
  <script src="js/calendar.js?v=v2026-09-30-01"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Calendar.init();
    });
  </script>
</body>
</html>
