<script>
  (function() {
    // Synchronize bottom navigation Focus tab active highlight
    const navItems = document.querySelectorAll('nav a');
    navItems.forEach(item => {
      const isFocus = item.getAttribute('data-path') === 'focus-timer';
      if (isFocus) {
        item.classList.remove('text-text-secondary');
        item.classList.add('text-primary-container');
      } else {
        item.classList.remove('text-primary-container');
        item.classList.add('text-text-secondary');
      }
    });

    // Lightweight interactive timer simulation for preview
    let isRunning = false;
    let totalSeconds = 25 * 60;
    let currentSeconds = totalSeconds;
    let intervalId = null;

    const playBtn = document.getElementById('btn-play');
    const playIcon = document.getElementById('play-icon');
    const digits = document.getElementById('timer-digits');
    const circle = document.getElementById('timer-progress');
    const resetBtn = document.getElementById('btn-reset');
    const skipBtn = document.getElementById('btn-skip');
    const circumference = 2 * Math.PI * 102; // 640.88

    function updateDisplay() {
      const mins = Math.floor(currentSeconds / 60);
      const secs = currentSeconds % 60;
      digits.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      const progress = currentSeconds / totalSeconds;
      const offset = circumference * (1 - progress);
      circle.style.strokeDashoffset = offset;
    }

    playBtn?.addEventListener('click', () => {
      isRunning = !isRunning;
      if (isRunning) {
        playIcon.textContent = 'pause';
        playIcon.style.marginLeft = '0px';
        intervalId = setInterval(() => {
          if (currentSeconds > 0) {
            currentSeconds--;
            updateDisplay();
          } else {
            clearInterval(intervalId);
            isRunning = false;
            playIcon.textContent = 'play_arrow';
            playIcon.style.marginLeft = '2px';
          }
        }, 1000);
      } else {
        clearInterval(intervalId);
        playIcon.textContent = 'play_arrow';
        playIcon.style.marginLeft = '2px';
      }
    });

    resetBtn?.addEventListener('click', () => {
      clearInterval(intervalId);
      isRunning = false;
      playIcon.textContent = 'play_arrow';
      playIcon.style.marginLeft = '2px';
      currentSeconds = totalSeconds;
      updateDisplay();
    });

    skipBtn?.addEventListener('click', () => {
      clearInterval(intervalId);
      isRunning = false;
      playIcon.textContent = 'play_arrow';
      playIcon.style.marginLeft = '2px';
      currentSeconds = 5 * 60; // preview short break
      totalSeconds = 5 * 60;
      updateDisplay();
    });

    // Sound toggle state handling
    const soundPills = document.querySelectorAll('.sound-toggle');
    soundPills.forEach(pill => {
      pill.addEventListener('click', () => {
        soundPills.forEach(p => {
          p.classList.remove('bg-primary-container/20', 'text-primary');
          p.classList.add('bg-surface-container/60', 'text-text-secondary');
        });
        pill.classList.remove('bg-surface-container/60', 'text-text-secondary');
        pill.classList.add('bg-primary-container/20', 'text-primary');
      });
    });
  })();
</script></main><div class="fixed bottom-20 right-margin z-50 pb-safe pointer-events-auto"><button aria-label="Add task or session" class="w-14 h-14 rounded-full bg-primary-container text-surface-base flex items-center justify-center shadow-[0_12px_24px_-4px_rgba(91,155,240,0.4)] hover:bg-accent-hover active:scale-95 transition-all"><span class="material-symbols-outlined text-[28px] font-bold">add</span></button></div><nav class="fixed bottom-0 inset-x-0 z-40 pb-safe bg-surface-glass backdrop-blur-2xl" data-active-classes="text-primary-container"><div class="flex justify-around items-center h-16 px-space-xs"><a class="flex flex-col items-center justify-center gap-0.5 min-w-[56px] h-12 text-text-secondary hover:text-text-primary transition-all" data-path="home" href="#"><span class="material-symbols-outlined text-[22px]">dashboard</span><span class="font-label-sm text-[11px] leading-tight">Home</span></a><a class="flex flex-col items-center justify-center gap-0.5 min-w-[56px] h-12 text-text-secondary hover:text-text-primary transition-all" data-path="tasks" href="#"><span class="material-symbols-outlined text-[22px]">check_circle</span><span class="font-label-sm text-[11px] leading-tight">Tasks</span></a><a class="flex flex-col items-center justify-center gap-0.5 min-w-[56px] h-12 text-text-secondary hover:text-text-primary transition-all" data-path="focus-timer" href="#"><span class="material-symbols-outlined text-[22px]">timelapse</span><span class="font-label-sm text-[11px] leading-tight">Focus</span></a><a class="flex flex-col items-center justify-center gap-0.5 min-w-[56px] h-12 text-text-secondary hover:text-text-primary transition-all" data-path="calendar" href="#"><span class="material-symbols-outlined text-[22px]">calendar_today</span><span class="font-label-sm text-[11px] leading-tight">Calendar</span></a><a class="flex flex-col items-center justify-center gap-0.5 min-w-[56px] h-12 text-text-secondary hover:text-text-primary transition-all" data-path="more-
