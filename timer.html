<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="description" content="StudyFlow - Focus Timer">
  <meta name="theme-color" content="#121314">
  <meta name="color-scheme" content="dark light">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StudyFlow">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-touch-fullscreen" content="yes">

  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="msapplication-config" href="browserconfig.xml">
  <meta name="msapplication-TileColor" content="#3B6FD8">

  <title>Focus - StudyFlow</title>
  <link rel="stylesheet" href="css/style.css?v=v2026-09-28-01">
</head>
<body>
  <!-- Navigation Containers -->
  <div id="sidebar-container"></div>
  <div id="bottom-nav-container"></div>

  <!-- Main Content -->
  <main class="main-container narrow-layout">
    <!-- Page Header -->
    <header class="page-header">
      <div class="page-header-title-group">
        <h1>Focus</h1>
        <p class="subtitle">Deep work session</p>
      </div>
    </header>

    <div>
      <!-- Task Selection -->
      <section class="card mb-md">
        <div class="form-group mb-sm">
          <label class="form-label text-center" for="timer-task">Active Task</label>
          <select id="timer-task" class="form-select text-center">
            <option value="">GENERAL FOCUS</option>
          </select>
        </div>
        <div class="form-group mb-0" id="subtask-select-container" style="display:none;">
          <label class="form-label text-center" for="timer-subtask">Subtask Focus</label>
          <select id="timer-subtask" class="form-select text-center">
            <option value="">SELECT SUBTASK</option>
          </select>
        </div>
        <div id="subtask-tracker-container" class="flex justify-center mt-xs"></div>
      </section>

      <!-- Options Toggle (Ambient noise + Session notes) -->
      <div class="flex justify-center mb-md">
        <button id="options-toggle-btn" type="button" class="btn btn-secondary btn-sm flex items-center gap-xs" onclick="document.getElementById('timer-options-panel').classList.toggle('open')">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Options</span>
        </button>
      </div>

      <div id="timer-options-panel" class="collapsible-section mb-md">
        <div class="collapsible-content p-md">
          <div class="form-group">
            <label class="form-label text-center">Background Noise</label>
            <div class="flex justify-center gap-sm">
              <button id="ambient-pink-btn" class="btn btn-secondary btn-sm" onclick="Timer.toggleAmbientSound('pink')" aria-pressed="false">Pink Noise</button>
              <button id="ambient-brown-btn" class="btn btn-secondary btn-sm" onclick="Timer.toggleAmbientSound('brown')" aria-pressed="false">Brown Noise</button>
            </div>
          </div>
          <div class="form-group mb-0">
            <label class="form-label">Session Notes</label>
            <textarea id="session-notes" class="form-input" placeholder="Notes for this focus session..." aria-label="Session notes" style="height: 60px; resize: none;"></textarea>
          </div>
        </div>
      </div>

      <!-- Timer Ring Display -->
      <section class="timer-ring-container" id="timer-container">
        <svg class="timer-ring-svg" viewBox="0 0 300 300">
          <circle class="timer-ring-bg" cx="150" cy="150" r="140"/>
          <circle id="timer-progress" class="timer-ring-fill" cx="150" cy="150" r="140"/>
        </svg>
        <div class="timer-center">
          <div class="active-mission" id="active-mission-label">Focusing on: General</div>
          <div class="timer-status-badge" id="timer-label">Focus</div>
          <div class="timer-main-time tabular-nums" id="timer-time">25:00</div>
          <div id="cycle-indicator" class="flex items-center justify-center gap-xs my-xs"></div>
          <div class="timer-task-name" id="selected-task-display">General</div>
        </div>
      </section>

      <!-- Primary & Secondary Controls -->
      <section class="timer-controls-fab">
        <button class="btn-fab-sub" id="reset-btn" aria-label="Reset Task" title="Reset Task">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="btn-fab-main" id="start-btn" aria-label="Start Focus" title="Start Focus">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" id="play-pause-icon" style="transform:translateX(2px);"><polygon points="6 3 20 12 6 21 6 3"/></svg>
        </button>
        <button class="btn-fab-sub" id="skip-btn" aria-label="Skip Session" title="Skip Session">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
        </button>
      </section>

      <!-- Stats Summary -->
      <section class="grid-3 mb-md">
        <div class="stat-pill text-center">
          <div>
            <div class="stat-pill-value" id="sessions-today">0</div>
            <div class="stat-pill-label">Sessions</div>
          </div>
        </div>
        <div class="stat-pill text-center">
          <div>
            <div class="stat-pill-value" id="total-time-today">0m</div>
            <div class="stat-pill-label">Focus Time</div>
          </div>
        </div>
        <div class="stat-pill text-center">
          <div>
            <div class="stat-pill-value" id="streak-count">0</div>
            <div class="stat-pill-label">Streak</div>
          </div>
        </div>
      </section>

      <!-- Wake Lock Status Indicator -->
      <div class="text-center">
        <span id="wake-lock-indicator" style="font-size:11px;font-weight:500;color:var(--text-muted);">⬤ Screen auto-off</span>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/storage.js?v=v2026-09-28-01"></script>
  <script src="js/subtask-utils.js?v=v2026-09-28-01"></script>
  <script src="js/pwa-manager.js?v=v2026-09-28-01"></script>
  <script src="js/achievements.js?v=v2026-09-28-01"></script>
  <script src="js/app.js?v=v2026-09-28-01"></script>
  <script src="js/timer.js?v=v2026-09-28-01"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      PWAManager.init();
      Timer.init();
    });
  </script>
</body>
</html>
