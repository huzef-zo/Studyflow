<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="description" content="StudyFlow - Pomodoro Timer for focused study sessions">
  <meta name="theme-color" content="#0A0B0F">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StudyFlow">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-touch-fullscreen" content="yes">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="msapplication-config" href="browserconfig.xml">
  <meta name="msapplication-TileColor" content="#5B9BF0">
  <title>Timer - StudyFlow</title>
  <link rel="stylesheet" href="css/style.css?v=v2026-09-30-01">
</head>
<body>
  <div id="sidebar-container"></div>
  <div id="bottom-nav-container"></div>

  <main class="main-container">
    <!-- Top Row Header -->
    <header class="page-header animate-fade-in flex items-center justify-between">
      <a href="index.html" class="btn btn-ghost btn-icon" aria-label="Go back to Home" title="Go back to Home">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </a>

      <div class="badge" id="timer-label" style="font-size:12px;font-weight:600;padding:6px 14px;background:rgba(91,155,240,0.12);color:var(--accent-text);border:none;">
        DEEP WORK
      </div>

      <a href="settings.html" class="btn btn-ghost btn-icon" aria-label="Timer settings" title="Timer settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </a>
    </header>

    <div class="narrow-layout text-center">

      <!-- Active Task Title -->
      <div class="mb-md animate-fade-in">
        <div style="font-size:11px;text-transform:uppercase;color:var(--text-muted);font-weight:600;letter-spacing:0.04em;" id="active-mission-label">Session 1 of 4</div>
        <h2 style="font-size:20px;margin-top:4px;color:var(--text-primary);" id="selected-task-display">Initializing...</h2>
      </div>

      <!-- Task Selector Dropdowns -->
      <div class="form-group mb-md flex flex-col gap-xs items-center animate-fade-in">
        <label class="form-label" for="timer-task" style="display:none;">Active Task Selection</label>
        <select id="timer-task" class="form-select" style="max-width:280px;text-align:center;font-size:12px;height:36px;border-radius:9999px;">
          <option value="">GENERAL FOCUS</option>
        </select>

        <label class="form-label" for="timer-subtask" style="display:none;">Subtask Focus</label>
        <select id="timer-subtask" class="form-select" style="max-width:280px;text-align:center;font-size:12px;height:36px;border-radius:9999px;display:none;">
          <option value="">SELECT SUBTASK</option>
        </select>

        <div id="subtask-tracker-container" style="display:flex;justify-content:center;margin-top:4px;"></div>
      </div>

      <!-- Timer Ring -->
      <section class="timer-ring-container animate-fade-in mb-md" id="timer-container" style="position:relative;display:inline-block;">
        <svg class="timer-ring-svg" viewBox="0 0 300 300" style="width:260px;height:260px;">
          <circle class="timer-ring-bg" cx="150" cy="150" r="135" fill="none" stroke="var(--progress-track)" stroke-width="8"/>
          <circle id="timer-progress" class="timer-ring-fill" cx="150" cy="150" r="135" fill="none" stroke="var(--accent-fill)" stroke-width="8" stroke-linecap="round" transform="rotate(-90 150 150)"/>
        </svg>
        <div class="timer-center" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100%;">
          <div class="timer-main-time" id="timer-time" style="font-size:48px;font-weight:700;">25:00</div>
          <span class="badge" style="font-size:10px;text-transform:uppercase;letter-spacing:0.06em;background:rgba(255,255,255,0.06);margin-top:6px;">POMODORO</span>
          <div id="cycle-indicator" style="display:flex;gap:6px;align-items:center;justify-content:center;margin-top:10px;"></div>
        </div>
      </section>

      <!-- Controls Row -->
      <section class="timer-controls-fab animate-fade-in flex items-center justify-center gap-md mb-lg">
        <button class="btn btn-secondary btn-icon" id="reset-btn" aria-label="Reset Timer" title="Reset Timer">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="btn btn-primary" id="start-btn" aria-label="Start Focus" title="Start Focus" style="width:64px;height:64px;border-radius:50%;padding:0;box-shadow:0 8px 24px rgba(91,155,240,0.35);">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" id="play-pause-icon" style="transform:translateX(2px);"><polygon points="6 3 20 12 6 21 6 3"/></svg>
        </button>
        <button class="btn btn-secondary btn-icon" id="skip-btn" aria-label="Skip Session" title="Skip Session">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
        </button>
      </section>

      <!-- Ambient Audio Card -->
      <section class="card mb-md animate-fade-in p-md text-left">
        <div class="flex items-center justify-between mb-sm">
          <h3 style="font-size:14px;margin:0;">Ambient Audio</h3>
          <button type="button" class="btn btn-ghost btn-sm" id="toggle-notes-btn" onclick="document.getElementById('notes-container').style.display = document.getElementById('notes-container').style.display === 'none' ? 'block' : 'none';" style="font-size:12px;color:var(--accent-text);">+ Add note</button>
        </div>
        <div class="flex gap-xs mb-sm">
          <button id="ambient-off-btn" class="filter-tab active" onclick="Timer.toggleAmbientSound('off')" aria-pressed="true">Off</button>
          <button id="ambient-brown-btn" class="filter-tab" onclick="Timer.toggleAmbientSound('brown')" aria-pressed="false">Brown</button>
          <button id="ambient-pink-btn" class="filter-tab" onclick="Timer.toggleAmbientSound('pink')" aria-pressed="false">Pink</button>
        </div>

        <div id="notes-container" style="display:none;" class="mt-sm">
          <textarea id="session-notes" class="form-input" placeholder="Notes for this session..." aria-label="Session notes" style="height:70px;resize:none;padding:10px;"></textarea>
        </div>
      </section>

      <!-- Stats Row -->
      <section class="animate-fade-in mb-md">
        <div class="grid-3">
          <div class="card p-sm text-center">
            <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;font-weight:600;">Sessions</div>
            <div id="sessions-today" style="font-size:18px;font-weight:700;color:var(--text-primary);margin-top:2px;">0</div>
          </div>
          <div class="card p-sm text-center">
            <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;font-weight:600;">Deep Work</div>
            <div id="total-time-today" style="font-size:18px;font-weight:700;color:var(--text-primary);margin-top:2px;">0m</div>
          </div>
          <div class="card p-sm text-center">
            <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;font-weight:600;">Streak</div>
            <div id="streak-count" style="font-size:18px;font-weight:700;color:var(--text-primary);margin-top:2px;">0</div>
          </div>
        </div>

        <!-- Wake lock status indicator -->
        <div style="text-align:center;margin-top:12px;">
          <span id="wake-lock-indicator" style="font-size:11px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;color:var(--text-muted);">⬤ Screen auto-off</span>
        </div>
      </section>

    </div>
  </main>

  <script src="js/storage.js?v=v2026-09-30-01"></script>
  <script src="js/subtask-utils.js?v=v2026-09-30-01"></script>
  <script src="js/pwa-manager.js?v=v2026-09-30-01"></script>
  <script src="js/achievements.js?v=v2026-09-30-01"></script>
  <script src="js/app.js?v=v2026-09-30-01"></script>
  <script src="js/timer.js?v=v2026-09-30-01"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      PWAManager.init();
      Timer.init();
    });
  </script>
</body>
</html>
