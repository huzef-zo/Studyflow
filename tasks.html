<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="description" content="StudyFlow - Task Manager and study objectives tracker">
  <meta name="theme-color" content="#0A0B0F">
  
  <!-- Standalone PWA Configuration -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StudyFlow">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-touch-fullscreen" content="yes">
  
  <!-- Icons and Manifest -->
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="msapplication-config" href="browserconfig.xml">
  <meta name="msapplication-TileColor" content="#5B9BF0">
  
  <title>Tasks - StudyFlow</title>
  <link rel="stylesheet" href="css/style.css?v=v2026-09-30-01">
</head>
<body>
  <!-- Navigation Containers -->
  <div id="sidebar-container"></div>
  <div id="bottom-nav-container"></div>

  <!-- Floating Add Task Button -->
  <button class="fab-btn" id="fab-add-task" aria-label="Add task" title="Add task">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
  </button>

  <!-- Main Content -->
  <main class="main-container">
    <!-- Top Bar Header -->
    <div id="global-top-bar" class="flex items-center justify-between w-full mb-md">
      <div class="top-bar-brand">
        <div class="top-bar-logo">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </div>
        <span class="top-bar-title">StudyFlow</span>
      </div>
      <a href="settings.html" class="user-avatar-circle" id="top-user-avatar" title="Settings" aria-label="User settings">
        SF
      </a>
    </div>

    <!-- Page Header -->
    <header class="page-header animate-fade-in">
      <div class="page-header-title-group">
        <div class="flex items-center gap-sm">
          <h1>Tasks</h1>
          <span class="badge" id="pending-tasks-badge">0 pending</span>
        </div>
      </div>
      <div class="page-header-actions flex items-center gap-sm flex-wrap">
        <div class="form-group mb-0">
          <input type="text" id="search-tasks" class="form-input" placeholder="Search tasks... (Ctrl+K)" aria-label="Search tasks">
        </div>
        <button class="btn btn-primary" id="add-task-btn" aria-label="Add new task">
          + New Task
        </button>
      </div>
    </header>

    <!-- Progress Strip -->
    <section class="card mb-md animate-fade-in p-sm" id="task-progress-strip">
      <!-- Populated by JS -->
    </section>

    <!-- Filter Bar (Horizontally Scrolling Chips) -->
    <div class="flex items-center gap-sm mb-md animate-fade-in filter-tabs" role="tablist" aria-label="Filter tasks">
      <button type="button" class="filter-tab active" data-filter="all" role="tab" aria-selected="true" tabindex="0">All</button>
      <button type="button" class="filter-tab" data-filter="pending" role="tab" aria-selected="false" tabindex="0">Active</button>
      <button type="button" class="filter-tab" data-filter="completed" role="tab" aria-selected="false" tabindex="0">Done</button>
      <select id="filter-priority" class="form-select" style="width: auto; min-width: 120px; font-size:12px; height:36px; padding: 0 28px 0 12px; border-radius:9999px;" aria-label="Filter by priority">
        <option value="all">Priority</option>
        <option value="critical">Critical</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <select id="filter-subject" class="form-select" style="width: auto; min-width: 120px; font-size:12px; height:36px; padding: 0 28px 0 12px; border-radius:9999px;" aria-label="Filter by subject">
        <option value="all">Subject</option>
        <!-- Populated by JS -->
      </select>
    </div>

    <!-- Task List -->
    <section id="task-list" class="animate-fade-in mb-md">
      <!-- Populated by JS -->
    </section>

    <!-- Deep Focus Sprint Bottom Card -->
    <section id="sprint-card" class="card animate-fade-in" style="display:none;">
      <!-- Populated by JS -->
    </section>
  </main>

  <!-- Scripts -->
  <script src="js/storage.js?v=v2026-09-30-01"></script>
  <script src="js/subtask-utils.js?v=v2026-09-30-01"></script>
  <script src="js/pwa-manager.js?v=v2026-09-30-01"></script>
  <script src="js/achievements.js?v=v2026-09-30-01"></script>
  <script src="js/app.js?v=v2026-09-30-01"></script>
  <script src="js/tasks.js?v=v2026-09-30-01"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      PWAManager.init();
      Tasks.init();
      document.getElementById('fab-add-task')?.addEventListener('click', () => {
        if (typeof Tasks !== 'undefined' && Tasks.openTaskModal) {
          Tasks.openTaskModal();
        }
      });
      const user = Storage.getUser();
      const avatarEl = document.getElementById('top-user-avatar');
      if (avatarEl && user) {
        const parts = (user.name || 'SF').trim().split(/\s+/).filter(Boolean);
        const initials = parts.length === 1 ? parts[0].substring(0, 2).toUpperCase() : (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        avatarEl.textContent = initials;
      }
    });
  </script>
</body>
</html>
