<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="description" content="StudyFlow - Weekly goals and progress tracking">
  <meta name="theme-color" content="#0A0B0F">
  
  <!-- Standalone PWA Configuration -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StudyFlow">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-touch-fullscreen" content="yes">
  
  <!-- Icons and Manifest -->
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="msapplication-config" href="browserconfig.xml">
  <meta name="msapplication-TileColor" content="#5B9BF0">
  
  <title>Goals - StudyFlow</title>
  <link rel="stylesheet" href="css/style.css?v=v2026-09-30-01">
</head>
<body>
  <!-- Navigation Containers -->
  <div id="sidebar-container"></div>
  <div id="bottom-nav-container"></div>

  <!-- Main Content -->
  <main class="main-container">
    <!-- Top Bar Header -->
    <div id="global-top-bar" class="flex items-center justify-between w-full mb-md">
      <div class="top-bar-brand">
        <div class="top-bar-logo">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </div>
        <span class="top-bar-title">StudyFlow</span>
      </div>
      <a href="settings.html" class="user-avatar-circle" id="top-user-avatar" title="Settings" aria-label="User settings">
        SF
      </a>
    </div>

    <!-- Page Header -->
    <header class="page-header animate-fade-in">
      <div class="page-header-title-group">
        <div class="flex items-center gap-sm">
          <h1>Goals</h1>
          <span class="badge" id="week-number-badge">Week 1</span>
        </div>
        <p class="subtitle">Chart your path to academic mastery</p>
      </div>
      <div class="page-header-actions flex items-center gap-sm flex-wrap">
        <button class="btn btn-secondary btn-sm" id="edit-goals-btn" aria-label="Edit targets" title="Edit targets">
          Edit Targets
        </button>
      </div>
    </header>

    <!-- Calendar Strip -->
    <section class="mb-lg animate-fade-in">
      <div class="filter-tabs flex gap-xs w-full" id="week-dates" style="justify-content:space-between;">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- Goals Ring Cards -->
    <div class="grid-2 mb-md animate-fade-in">
      <!-- Tasks Donut -->
      <section class="card text-center p-md">
        <div class="card-header justify-center mb-xs">
          <h3 class="card-title">Weekly Tasks</h3>
        </div>
        <div class="donut-container my-sm" style="position:relative;display:inline-block;">
          <svg viewBox="0 0 36 36" style="width: 110px; height: 120px;">
            <circle cx="18" cy="18" r="15.9155" fill="none" stroke="var(--progress-track)" stroke-width="3" />
            <circle id="tasks-donut-fill" cx="18" cy="18" r="15.9155" fill="none" stroke="var(--accent-fill)" stroke-width="3.5" stroke-dasharray="100" stroke-dashoffset="100" stroke-linecap="round" transform="rotate(-90 18 18)" style="transition: stroke-dashoffset 0.8s ease;" />
          </svg>
          <div class="donut-center" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">
            <div id="tasks-percent" style="font-size: 1.25rem; font-weight: 700; color:var(--text-primary);">0%</div>
          </div>
        </div>
        <div>
          <div style="font-size: 1rem; font-weight: 600;">
            <span id="tasks-goal-value">0</span> / <span id="tasks-goal-max">10</span>
          </div>
          <p style="color: var(--text-muted); font-size: 11px; text-transform: uppercase;">Tasks Completed</p>
        </div>
      </section>

      <!-- Hours Donut -->
      <section class="card text-center p-md">
        <div class="card-header justify-center mb-xs">
          <h3 class="card-title">Focus Target</h3>
        </div>
        <div class="donut-container my-sm" style="position:relative;display:inline-block;">
          <svg viewBox="0 0 36 36" style="width: 110px; height: 120px;">
            <circle cx="18" cy="18" r="15.9155" fill="none" stroke="var(--progress-track)" stroke-width="3" />
            <circle id="hours-donut-fill" cx="18" cy="18" r="15.9155" fill="none" stroke="var(--accent-fill)" stroke-width="3.5" stroke-dasharray="100" stroke-dashoffset="100" stroke-linecap="round" transform="rotate(-90 18 18)" style="transition: stroke-dashoffset 0.8s ease;" />
          </svg>
          <div class="donut-center" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">
            <div id="hours-percent" style="font-size: 1.25rem; font-weight: 700; color:var(--text-primary);">0%</div>
          </div>
        </div>
        <div>
          <div style="font-size: 1rem; font-weight: 600;">
            <span id="hours-goal-value">0</span>h / <span id="hours-goal-max">20</span>h
          </div>
          <p style="color: var(--text-muted); font-size: 11px; text-transform: uppercase;">Deep Work Logged</p>
        </div>
      </section>
    </div>

    <!-- Daily Progress Horizontal Scroll -->
    <section class="card mb-md animate-fade-in">
      <div class="card-header mb-sm">
        <h3 class="card-title">Daily Progress</h3>
        <span class="badge" id="daily-avg-badge">Avg 0%</span>
      </div>
      <div class="daily-bar-scroll flex gap-sm" style="overflow-x:auto;" id="daily-progress">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- Streak & Motivation -->
    <section class="card animate-fade-in">
      <div class="flex items-center justify-between w-full">
        <div class="flex items-center gap-md">
          <div class="stat-pill-icon" style="width:36px;height:36px;">
            🔥
          </div>
          <div>
            <h4 style="font-size: 14px; margin-bottom: 2px;"><span id="streak-count">0</span> Day Streak</h4>
            <p id="motivation-message" style="margin: 0; font-size: 12px; color: var(--text-secondary);">Keep the momentum going!</p>
          </div>
        </div>
        <div id="freeze-badge-container" class="badge">
          Freezes: <span id="freeze-count">0</span>
        </div>
      </div>
    </section>
  </main>

  <!-- Scripts -->
  <script src="js/storage.js?v=v2026-09-30-01"></script>
  <script src="js/subtask-utils.js?v=v2026-09-30-01"></script>
  <script src="js/pwa-manager.js?v=v2026-09-30-01"></script>
  <script src="js/achievements.js?v=v2026-09-30-01"></script>
  <script src="js/app.js?v=v2026-09-30-01"></script>
  <script src="js/goals.js?v=v2026-09-30-01"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      PWAManager.init();
      Goals.init();
      const user = Storage.getUser();
      const avatarEl = document.getElementById('top-user-avatar');
      if (avatarEl && user) {
        const parts = (user.name || 'SF').trim().split(/\s+/).filter(Boolean);
        const initials = parts.length === 1 ? parts[0].substring(0, 2).toUpperCase() : (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        avatarEl.textContent = initials;
      }
    });
  </script>
</body>
</html>
