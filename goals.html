<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="description" content="StudyFlow - Goals and progress tracking">
  <meta name="theme-color" content="#121314">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StudyFlow">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-touch-fullscreen" content="yes">
  
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="msapplication-config" href="browserconfig.xml">
  <meta name="msapplication-TileColor" content="#3B6FD8">
  
  <title>Goals - StudyFlow</title>
  <link rel="stylesheet" href="css/style.css?v=v2026-09-28-01">
</head>
<body>
  <!-- Navigation Containers -->
  <div id="sidebar-container"></div>
  <div id="bottom-nav-container"></div>

  <!-- Main Content -->
  <main class="main-container narrow-layout">
    <!-- Page Header -->
    <header class="page-header">
      <div class="page-header-title-group">
        <h1>Goals</h1>
        <p class="subtitle">Track weekly and daily targets</p>
      </div>
      <div class="page-header-actions flex items-center gap-sm flex-wrap">
        <button class="btn btn-secondary" id="edit-goals-btn" aria-label="Edit weekly and daily target goals" title="Edit weekly and daily target goals">
          Edit Targets
        </button>
      </div>
    </header>

    <!-- Calendar Strip -->
    <section class="mb-md">
      <div class="calendar-strip" id="week-dates">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- Goals Visualization -->
    <div class="grid-2 mb-md">
      <!-- Tasks Donut -->
      <section class="card text-center">
        <div class="card-header">
          <h3 class="card-title">Tasks Target</h3>
        </div>
        <div class="donut-container">
          <svg viewBox="0 0 36 36" style="width: 100px; height: 100px;">
            <circle cx="18" cy="18" r="15.9155" fill="none" stroke="var(--progress-track)" stroke-width="3" />
            <circle id="tasks-donut-fill" cx="18" cy="18" r="15.9155" fill="none" stroke="var(--accent-fill)" stroke-width="3.5" stroke-dasharray="100" stroke-dashoffset="100" stroke-linecap="round" transform="rotate(-90 18 18)" style="transition: stroke-dashoffset 200ms ease-out;" />
          </svg>
          <div class="donut-center">
            <div id="tasks-percent" style="font-size: var(--font-size-md); font-weight: 600; color: var(--accent-text);" class="tabular-nums">0%</div>
          </div>
        </div>
        <div class="mt-xs">
          <div style="font-size: var(--font-size-sm); font-weight: 600;" class="tabular-nums">
            <span id="tasks-goal-value">0</span> / <span id="tasks-goal-max">10</span>
          </div>
          <p class="text-muted" style="font-size: var(--font-size-xs);">Tasks Completed</p>
        </div>
      </section>

      <!-- Hours Donut -->
      <section class="card text-center">
        <div class="card-header">
          <h3 class="card-title">Hours Target</h3>
        </div>
        <div class="donut-container">
          <svg viewBox="0 0 36 36" style="width: 100px; height: 100px;">
            <circle cx="18" cy="18" r="15.9155" fill="none" stroke="var(--progress-track)" stroke-width="3" />
            <circle id="hours-donut-fill" cx="18" cy="18" r="15.9155" fill="none" stroke="var(--accent-fill)" stroke-width="3.5" stroke-dasharray="100" stroke-dashoffset="100" stroke-linecap="round" transform="rotate(-90 18 18)" style="transition: stroke-dashoffset 200ms ease-out;" />
          </svg>
          <div class="donut-center">
            <div id="hours-percent" style="font-size: var(--font-size-md); font-weight: 600; color: var(--accent-text);" class="tabular-nums">0%</div>
          </div>
        </div>
        <div class="mt-xs">
          <div style="font-size: var(--font-size-sm); font-weight: 600;" class="tabular-nums">
            <span id="hours-goal-value">0</span> / <span id="hours-goal-max">20</span>h
          </div>
          <p class="text-muted" style="font-size: var(--font-size-xs);">Focus Hours</p>
        </div>
      </section>
    </div>

    <!-- Daily Progress Bar Chart -->
    <section class="card mb-md">
      <div class="card-header">
        <h3 class="card-title">Daily Progress</h3>
      </div>
      <div class="daily-bar-scroll">
        <div class="daily-bar-container" id="daily-progress">
          <!-- Populated by JS -->
        </div>
      </div>
    </section>

    <!-- Streak & Motivation -->
    <section class="card">
      <div class="flex items-center justify-between w-full">
        <div>
          <h4 style="margin-bottom: 2px;">Streak: <span id="streak-count" class="tabular-nums">0</span> Days</h4>
          <p id="motivation-message" class="text-secondary" style="font-size: var(--font-size-xs);">Keep up the momentum!</p>
        </div>
        <div id="freeze-badge-container" class="badge">
          Freezes: <span id="freeze-count" class="tabular-nums">1</span>
        </div>
      </div>
    </section>
  </main>

  <!-- Scripts -->
  <script src="js/storage.js?v=v2026-09-28-01"></script>
  <script src="js/subtask-utils.js?v=v2026-09-28-01"></script>
  <script src="js/pwa-manager.js?v=v2026-09-28-01"></script>
  <script src="js/achievements.js?v=v2026-09-28-01"></script>
  <script src="js/app.js?v=v2026-09-28-01"></script>
  <script src="js/goals.js?v=v2026-09-28-01"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      PWAManager.init();
      Goals.init();
    });
  </script>
</body>
</html>
