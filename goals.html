<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="description" content="StudyFlow - Weekly goals and progress tracking">
  <meta name="theme-color" content="#14161B">
  
  <!-- Standalone PWA Configuration -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StudyFlow">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-touch-fullscreen" content="yes">
  
  <!-- Icons and Manifest -->
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="msapplication-config" href="browserconfig.xml">
  <meta name="msapplication-TileColor" content="#5B9BF0">
  
  <title>Goals - StudyFlow</title>
  <link rel="stylesheet" href="css/style.css?v=v2025-05-03-02">
</head>
<body>
  <!-- Navigation Containers -->
  <div id="sidebar-container"></div>
  <div id="bottom-nav-container"></div>

  <!-- Main Content -->
  <main class="main-container">
    <!-- Page Header -->
    <header class="page-header animate-fade-in">
      <div class="page-header-title-group">
        <h1>Strategic Goals</h1>
        <p class="subtitle">Chart your path to academic mastery</p>
      </div>
      <div class="page-header-actions flex items-center gap-sm flex-wrap">
        <button class="btn btn-secondary" id="edit-goals-btn" aria-label="Edit weekly and daily target goals" title="Edit weekly and daily target goals">
          Edit Targets
        </button>
      </div>
    </header>

    <!-- Calendar Strip -->
    <section class="mb-lg animate-fade-in">
      <div class="calendar-strip" id="week-dates">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- Goals Visualization -->
    <div class="grid animate-fade-in" style="grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--spacing-md);">
      <!-- Tasks Donut -->
      <section class="card">
        <div class="card-header">
          <h3 class="card-title">Mission Quota</h3>
        </div>
        <div class="donut-container">
          <svg viewBox="0 0 36 36" style="width: 120px; height: 120px;">
            <circle cx="18" cy="18" r="15.9155" fill="none" stroke="var(--progress-track)" stroke-width="3" />
            <circle id="tasks-donut-fill" cx="18" cy="18" r="15.9155" fill="none" stroke="var(--accent-fill)" stroke-width="3.5" stroke-dasharray="100" stroke-dashoffset="100" stroke-linecap="round" transform="rotate(-90 18 18)" style="transition: stroke-dashoffset 0.8s ease;" />
          </svg>
          <div class="donut-center">
            <div id="tasks-percent" class="gradient-text" style="font-size: 1.5rem; font-weight: 500;">0%</div>
          </div>
        </div>
        <div class="text-center">
          <div style="font-size: 1.1rem; font-weight: 500; margin-bottom: 2px;">
            <span id="tasks-goal-value" class="gradient-text">0</span> / <span id="tasks-goal-max">10</span>
          </div>
          <p style="color: var(--text-muted); font-size: 10px; text-transform: uppercase;">Missions Completed</p>
        </div>
      </section>

      <!-- Hours Donut -->
      <section class="card">
        <div class="card-header">
          <h3 class="card-title">Focus Quota</h3>
        </div>
        <div class="donut-container">
          <svg viewBox="0 0 36 36" style="width: 120px; height: 120px;">
            <circle cx="18" cy="18" r="15.9155" fill="none" stroke="var(--progress-track)" stroke-width="3" />
            <circle id="hours-donut-fill" cx="18" cy="18" r="15.9155" fill="none" stroke="var(--accent-fill)" stroke-width="3.5" stroke-dasharray="100" stroke-dashoffset="100" stroke-linecap="round" transform="rotate(-90 18 18)" style="transition: stroke-dashoffset 0.8s ease;" />
          </svg>
          <div class="donut-center">
            <div id="hours-percent" class="gradient-text" style="font-size: 1.5rem; font-weight: 500;">0%</div>
          </div>
        </div>
        <div class="text-center">
          <div style="font-size: 1.1rem; font-weight: 500; margin-bottom: 2px;">
            <span id="hours-goal-value" class="gradient-text">0</span> / <span id="hours-goal-max">20</span>H
          </div>
          <p style="color: var(--text-muted); font-size: 10px; text-transform: uppercase;">Deep Work Logged</p>
        </div>
      </section>
    </div>

    <!-- Daily Progress Bar Chart -->
    <section class="card mt-md animate-fade-in">
      <div class="card-header">
        <h3 class="card-title">Daily Performance</h3>
      </div>
      <div class="daily-bar-scroll">
        <div class="daily-bar-container" id="daily-progress">
          <!-- Populated by JS -->
        </div>
      </div>
    </section>

    <!-- Motivation -->
    <section class="card mt-md animate-fade-in">
      <div class="flex items-center justify-between w-full">
        <div class="flex items-center gap-md">
          <div class="stat-icon" style="margin: 0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-fill)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
          </div>
          <div>
            <h4 style="font-size: 14px; margin-bottom: 2px;">Streak: <span id="streak-count">0</span> Days</h4>
            <p id="motivation-message" style="margin: 0; font-size: 12px; color: var(--text-secondary);">Keep the momentum!</p>
          </div>
        </div>
        <div id="freeze-badge-container" class="badge">
          Freezes: <span id="freeze-count">1</span>
        </div>
      </div>
    </section>
  </main>

  <!-- Scripts -->
  <script src="js/storage.js?v=v2025-05-03-02"></script>
  <script src="js/subtask-utils.js?v=v2025-05-03-02"></script>
  <script src="js/pwa-manager.js?v=v2025-05-03-02"></script>
  <script src="js/achievements.js?v=v2025-05-03-02"></script>
  <script src="js/app.js?v=v2025-05-03-02"></script>
  <script src="js/goals.js?v=v2025-05-03-02"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      PWAManager.init();
      Goals.init();
    });
  </script>
</body>
</html>
