<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="description" content="StudyFlow - Analytics and Progress Tracking">
  <meta name="theme-color" content="#0B0F19" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="dark">
  
  <!-- Standalone PWA Configuration -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StudyFlow">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-touch-fullscreen" content="yes">
  
  <!-- Icons and Manifest -->
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="msapplication-config" href="browserconfig.xml">
  <meta name="msapplication-TileColor" content="#6C5CE7">
  
  <title>Analytics - StudyFlow</title>
  <link rel="stylesheet" href="css/style.css?v=v2025-05-03-02">
</head>
<body>
  <!-- Navigation Containers -->
  <div id="sidebar-container"></div>
  <div id="bottom-nav-container"></div>

  <!-- Main Content -->
  <main class="main-container">
    <!-- Page Header -->
    <header class="page-header animate-fade-in">
      <h1 class="glowing-text">Performance Analytics</h1>
      <p class="subtitle">In-depth intelligence on your study patterns</p>
    </header>

    <div class="narrow-layout">

      <!-- Stats Period Selector (Always Visible) -->
      <section class="card animate-fade-in mb-md" style="padding: 12px 16px;">
        <div class="flex items-center justify-between">
          <span style="font-size:13px; font-weight:600; color:var(--text-secondary);">Stats Period</span>
          <div class="filter-tabs" style="margin:0;" role="tablist" aria-label="Stats period">
            <div class="filter-tab active" data-period="all" role="tab" aria-selected="true" tabindex="0">All Time</div>
            <div class="filter-tab" data-period="30" role="tab" aria-selected="false" tabindex="0">Last 30 Days</div>
            <div class="filter-tab" data-period="7" role="tab" aria-selected="false" tabindex="0">Last 7 Days</div>
          </div>
        </div>
      </section>

      <!-- Dynamic Analytics Content -->
      <div id="analytics-content">
        <!-- Activity Frequency Graph -->
        <section class="card animate-fade-in mb-md">
          <div class="card-header">
            <h3 class="card-title">Timeline Activity</h3>
          </div>
          <div class="card-body">
            <div id="frequency-graph" style="height: 180px; width: 100%;">
              <!-- Populated by JS -->
            </div>
          </div>
        </section>

        <!-- Stats Summary Grid -->
        <section class="grid-2-dense animate-fade-in mb-md">
          <div class="stat-pill accent-blue">
            <div>
              <div class="stat-pill-value" id="total-completed-tasks">0</div>
              <div class="stat-pill-label">Total Missions</div>
            </div>
          </div>
          <div class="stat-pill accent-teal">
            <div>
              <div class="stat-pill-value" id="total-study-hours">0H</div>
              <div class="stat-pill-label">Total Focus</div>
            </div>
          </div>
          <div class="stat-pill accent-orange">
            <div>
              <div class="stat-pill-value" id="completion-rate">0%</div>
              <div class="stat-pill-label">Success Rate</div>
            </div>
          </div>
          <div class="stat-pill accent-violet">
            <div>
              <div class="stat-pill-value" id="all-time-streak">0</div>
              <div class="stat-pill-label">Best Streak</div>
            </div>
          </div>
        </section>

        <!-- Mastery Grid -->
        <section class="card animate-fade-in mb-md">
          <div class="card-header">
            <h3 class="card-title">Sector Mastery</h3>
          </div>
          <div id="mastery-overview" style="display: grid; gap: 12px;">
            <!-- Populated by JS -->
          </div>
        </section>

        <!-- Current Objectives -->
        <section class="card animate-fade-in mb-md">
          <div class="card-header">
            <h3 class="card-title">Current Objectives</h3>
            <span class="badge" style="background: rgba(0, 212, 181, 0.15); color: var(--secondary);" id="progress-percentage">0%</span>
          </div>
          <div id="tasks-progress"></div>
          <div id="hours-progress" class="mt-md"></div>
        </section>

        <!-- Study History -->
        <section class="card animate-fade-in mb-md">
          <div class="card-header">
            <h3 class="card-title">Study History</h3>
          </div>
          <div id="study-history-list" class="flex flex-col gap-sm" style="margin-top: 12px; max-height: 400px; overflow-y: auto;">
            <!-- Populated by JS -->
          </div>
        </section>

        <!-- Daily Reflections Log -->
        <section class="card animate-fade-in">
          <div class="card-header">
            <h3 class="card-title">Tactical Reflections</h3>
          </div>
          <div id="reflections-log" class="flex flex-col gap-sm" style="margin-top: 12px;">
            <!-- Populated by JS -->
          </div>
        </section>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="js/storage.js?v=v2025-05-03-02"></script>
  <script src="js/subtask-utils.js?v=v2025-05-03-02"></script>
  <script src="js/pwa-manager.js?v=v2025-05-03-02"></script>
  <script src="js/achievements.js?v=v2025-05-03-02"></script>
  <script src="js/app.js?v=v2025-05-03-02"></script>
  <script src="js/history.js?v=v2025-05-03-02"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      PWAManager.init();
      History.init();
    });
  </script>
</body>
</html>
