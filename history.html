<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="description" content="StudyFlow - Analytics and Progress Tracking">
  <meta name="theme-color" content="#0A0B0F">
  
  <!-- Standalone PWA Configuration -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StudyFlow">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-touch-fullscreen" content="yes">
  
  <!-- Icons and Manifest -->
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="msapplication-config" href="browserconfig.xml">
  <meta name="msapplication-TileColor" content="#5B9BF0">
  
  <title>Analytics - StudyFlow</title>
  <link rel="stylesheet" href="css/style.css?v=v2026-09-30-01">
</head>
<body>
  <!-- Navigation Containers -->
  <div id="sidebar-container"></div>
  <div id="bottom-nav-container"></div>

  <!-- Main Content -->
  <main class="main-container">
    <!-- Top Bar Header -->
    <div id="global-top-bar" class="flex items-center justify-between w-full mb-md">
      <div class="top-bar-brand">
        <div class="top-bar-logo">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 0-3-3H2z"/></svg>
        </div>
        <span class="top-bar-title">StudyFlow</span>
      </div>
      <a href="settings.html" class="user-avatar-circle" id="top-user-avatar" title="Settings" aria-label="User settings">
        SF
      </a>
    </div>

    <!-- Page Header -->
    <header class="page-header animate-fade-in mb-md">
      <div class="page-header-title-group">
        <h1>Analytics</h1>
        <p class="subtitle">In-depth intelligence on your study patterns</p>
      </div>
    </header>

    <div class="narrow-layout">
      <!-- Segmented Control Tablist (7 days / 30 days / All time) -->
      <section class="card animate-fade-in mb-md p-xs">
        <div class="filter-tabs flex gap-xs w-full" role="tablist" aria-label="Stats period">
          <button type="button" class="filter-tab active flex-1 text-center" data-period="7" role="tab" aria-selected="true" tabindex="0">7 Days</button>
          <button type="button" class="filter-tab flex-1 text-center" data-period="30" role="tab" aria-selected="false" tabindex="0">30 Days</button>
          <button type="button" class="filter-tab flex-1 text-center" data-period="all" role="tab" aria-selected="false" tabindex="0">All Time</button>
        </div>
      </section>

      <!-- Compact No Activity State -->
      <div id="no-activity-message" class="card mb-md text-center p-md" style="display:none;">
        <p style="color:var(--text-muted); font-size:13px; margin:0;">No activity recorded yet for this period.</p>
      </div>

      <!-- Activity Area Chart Card -->
      <section class="card animate-fade-in mb-md" id="graph-section">
        <div class="card-header mb-sm">
          <h3 class="card-title">Activity</h3>
          <span class="badge" id="daily-avg-badge">Daily avg: 0h</span>
        </div>
        <div id="frequency-graph" style="height: 180px; width: 100%;">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- 2x2 Stat Tiles -->
      <section class="grid-2 animate-fade-in mb-md" id="summary-stats-grid">
        <div class="card p-md">
          <div class="flex items-center justify-between mb-xs">
            <span style="font-size:11px;text-transform:uppercase;color:var(--text-muted);font-weight:600;">Total Tasks</span>
            <span class="badge" id="tasks-delta-chip" style="font-size:10px;display:none;"></span>
          </div>
          <div class="data-number" id="total-completed-tasks">0</div>
        </div>

        <div class="card p-md">
          <div class="flex items-center justify-between mb-xs">
            <span style="font-size:11px;text-transform:uppercase;color:var(--text-muted);font-weight:600;">Focus Hours</span>
            <span class="badge" id="hours-delta-chip" style="font-size:10px;display:none;"></span>
          </div>
          <div class="data-number" id="total-study-hours">0h</div>
        </div>

        <div class="card p-md">
          <div class="flex items-center justify-between mb-xs">
            <span style="font-size:11px;text-transform:uppercase;color:var(--text-muted);font-weight:600;">Success Rate</span>
            <span class="badge" id="rate-delta-chip" style="font-size:10px;display:none;"></span>
          </div>
          <div class="data-number" id="completion-rate">0%</div>
        </div>

        <div class="card p-md">
          <div class="flex items-center justify-between mb-xs">
            <span style="font-size:11px;text-transform:uppercase;color:var(--text-muted);font-weight:600;">Best Streak</span>
            <span class="badge" id="streak-delta-chip" style="font-size:10px;display:none;">Personal record</span>
          </div>
          <div class="data-number" id="all-time-streak">0</div>
        </div>
      </section>

      <!-- Subjects Focus Time Share Card -->
      <section class="card animate-fade-in mb-md">
        <div class="card-header mb-sm">
          <h3 class="card-title">Subjects</h3>
        </div>
        <div id="mastery-overview" class="flex flex-col gap-xs">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- Optimal Deep Work Window Insight Card (hidden if < 5 sessions) -->
      <section id="deep-work-insight-card" class="card animate-fade-in mb-md p-md" style="display:none;">
        <!-- Populated by JS -->
      </section>

      <!-- Study History -->
      <section class="card animate-fade-in mb-md">
        <div class="card-header mb-sm">
          <h3 class="card-title">Study History</h3>
        </div>
        <div id="study-history-list" class="flex flex-col gap-xs" style="max-height: 480px; overflow-y: auto;">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- Daily Reflections Log -->
      <section class="card animate-fade-in mb-md">
        <div class="card-header mb-sm">
          <h3 class="card-title">Tactical Reflections</h3>
        </div>
        <div id="reflections-log" class="flex flex-col gap-xs">
          <!-- Populated by JS -->
        </div>
      </section>
    </div>
  </main>

  <!-- Hidden elements for test compatibility -->
  <div id="productive-day" style="display:none;"></div>
  <div id="tasks-progress" style="display:none;"></div>
  <div id="hours-progress" style="display:none;"></div>
  <div id="progress-percentage" style="display:none;"></div>

  <!-- Scripts -->
  <script src="js/storage.js?v=v2026-09-30-01"></script>
  <script src="js/subtask-utils.js?v=v2026-09-30-01"></script>
  <script src="js/pwa-manager.js?v=v2026-09-30-01"></script>
  <script src="js/achievements.js?v=v2026-09-30-01"></script>
  <script src="js/app.js?v=v2026-09-30-01"></script>
  <script src="js/history.js?v=v2026-09-30-01"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      PWAManager.init();
      History.init();
    });
  </script>
</body>
</html>
