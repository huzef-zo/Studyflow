<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="description" content="StudyFlow - Analytics and Progress Tracking">
  <meta name="theme-color" content="#121314">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StudyFlow">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-touch-fullscreen" content="yes">
  
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="msapplication-config" href="browserconfig.xml">
  <meta name="msapplication-TileColor" content="#3B6FD8">
  
  <title>Analytics - StudyFlow</title>
  <link rel="stylesheet" href="css/style.css?v=v2026-09-28-01">
</head>
<body>
  <!-- Navigation Containers -->
  <div id="sidebar-container"></div>
  <div id="bottom-nav-container"></div>

  <!-- Main Content -->
  <main class="main-container narrow-layout">
    <!-- Page Header -->
    <header class="page-header">
      <div class="page-header-title-group">
        <h1>Analytics</h1>
        <p class="subtitle">Study patterns and statistics</p>
      </div>
    </header>

    <div>
      <!-- Stats Period Selector -->
      <section class="card mb-md">
        <div class="flex items-center justify-between">
          <span style="font-size: var(--font-size-xs); font-weight: 500; color: var(--text-secondary);">Period</span>
          <div class="filter-tabs" role="tablist" aria-label="Stats period">
            <div class="filter-tab active" data-period="all" role="tab" aria-selected="true" tabindex="0">All Time</div>
            <div class="filter-tab" data-period="30" role="tab" aria-selected="false" tabindex="0">30 Days</div>
            <div class="filter-tab" data-period="7" role="tab" aria-selected="false" tabindex="0">7 Days</div>
          </div>
        </div>
      </section>

      <!-- Compact No Activity State -->
      <div id="no-activity-message" class="card mb-md text-center p-md" style="display:none;">
        <p class="text-muted mb-0">No activity recorded yet for this period.</p>
      </div>

      <!-- Timeline Activity Chart -->
      <section class="card mb-md" id="graph-section">
        <div class="card-header">
          <h3 class="card-title">Timeline Activity</h3>
        </div>
        <div class="card-body">
          <div id="frequency-graph" style="height: 180px; width: 100%;">
            <!-- Populated by JS -->
          </div>
        </div>
      </section>

      <!-- Stats Summary Grid -->
      <section class="grid-3 mb-md" id="summary-stats-grid">
        <div class="stat-pill flex-col justify-center items-center text-center">
          <div class="stat-pill-value tabular-nums" id="total-completed-tasks">0</div>
          <div class="stat-pill-label">Completed Tasks</div>
        </div>
        <div class="stat-pill flex-col justify-center items-center text-center">
          <div class="stat-pill-value tabular-nums" id="total-study-hours">0h</div>
          <div class="stat-pill-label">Focus Time</div>
        </div>
        <div class="stat-pill flex-col justify-center items-center text-center">
          <div class="stat-pill-value tabular-nums" id="completion-rate">0%</div>
          <div class="stat-pill-label">Completion Rate</div>
        </div>
        <div class="stat-pill flex-col justify-center items-center text-center">
          <div class="stat-pill-value" id="productive-day" style="font-size: var(--font-size-sm);">-</div>
          <div class="stat-pill-label">Peak Day</div>
        </div>
        <div class="stat-pill flex-col justify-center items-center text-center">
          <div class="stat-pill-value tabular-nums" id="all-time-streak">0</div>
          <div class="stat-pill-label">Best Streak</div>
        </div>
      </section>

      <!-- Subject Mastery -->
      <section class="card mb-md">
        <div class="card-header">
          <h3 class="card-title">Subject Mastery</h3>
        </div>
        <div id="mastery-overview" class="grid-2-dense">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- Current Progress -->
      <section class="card mb-md">
        <div class="card-header">
          <h3 class="card-title">Current Goals Progress</h3>
          <span class="badge tabular-nums" id="progress-percentage">0%</span>
        </div>
        <div id="tasks-progress"></div>
        <div id="hours-progress" class="mt-sm"></div>
      </section>

      <!-- Study History -->
      <section class="card mb-md">
        <div class="card-header">
          <h3 class="card-title">Study History</h3>
        </div>
        <div id="study-history-list" class="flex flex-col gap-xs mt-sm" style="max-height: 480px; overflow-y: auto;">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- Daily Reflections Log -->
      <section class="card">
        <div class="card-header">
          <h3 class="card-title">Daily Reflections</h3>
        </div>
        <div id="reflections-log" class="flex flex-col gap-xs mt-sm">
          <!-- Populated by JS -->
        </div>
      </section>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/storage.js?v=v2026-09-28-01"></script>
  <script src="js/subtask-utils.js?v=v2026-09-28-01"></script>
  <script src="js/pwa-manager.js?v=v2026-09-28-01"></script>
  <script src="js/achievements.js?v=v2026-09-28-01"></script>
  <script src="js/app.js?v=v2026-09-28-01"></script>
  <script src="js/history.js?v=v2026-09-28-01"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      PWAManager.init();
      History.init();
    });
  </script>
</body>
</html>
